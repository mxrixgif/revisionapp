s(T_PT,"Balance and add the missing state symbol: K(s) + Br₂(g) → KBr","2K(s) + Br₂(g) → 2KBr(s)","June 2023 · Chemistry 2 · Q6(c)"),
s(T_PT,"Complete and balance with state symbols: K + F₂ → KF","2K(s) + F₂(g) → 2KF(s)","June 2020 · Chemistry 2 · Q5(d)"),
s(T_PT,"Explain, in terms of intermolecular forces, why fluorine has a very low boiling point (−188 °C).","The intermolecular forces between fluorine molecules are weak, so little energy is needed to overcome them.","June 2020 · Chemistry 2 · Q5(c)"),
s(T_PT,"Describe the reactions of lithium, sodium and potassium with water and predict what rubidium and caesium would do.","Key points: reactivity increases down the group (K more than Na more than Li). Li, Na and K float and move on the water and give off hydrogen bubbles. Sodium melts into a ball. Potassium burns with a lilac flame. An alkaline hydroxide solution forms (purple with universal indicator). Word equation: metal + water → metal hydroxide + hydrogen. Rubidium would be more reactive than potassium and caesium even more so (explosive).","June 2023 · Chemistry 2 · Q6(e)"),

/* ===== BONDING, STRUCTURE & CONDUCTIVITY ===== */
s(T_BOND,"What is a covalent bond?","A shared pair of electrons between two atoms.","June 2018 · Chemistry 2 · Q5(c)(i)"),
s(T_BOND,"Explain why chlorine is a gas rather than a liquid at room temperature.","Chlorine is made of small molecules with weak intermolecular forces, so little energy is needed to separate them. Its boiling point is below room temperature.","June 2018 · Chemistry 2 · Q5(c)(ii)"),
s(T_BOND,"What type of bonding is there in hydrogen chloride?","Covalent.","June 2020 · Chemistry 2 · Q3(b)(iv)"),
s(T_BOND,"What is a molecule?","Two or more atoms joined together by covalent bonds (shared pairs of electrons).","June 2023 · Chemistry 2 · Q4(b)(ii)"),
s(T_BOND,"State one property of diamond that is caused by its giant covalent structure.","Any one: very high melting/boiling point; very hard; does not conduct electricity; insoluble in water.","June 2018 · Chemistry 1 · Q2(e)"),
s(T_BOND,"Explain how metals such as sodium conduct electricity.","Metals have delocalised electrons that are free to move and carry charge.","June 2020 · Chemistry 1 · Q3(e)"),
m(T_BOND,"A substance has a high melting point and conducts electricity only when molten. What type of substance is it?",["Giant covalent","Ionic","Metallic","Simple molecular"],1,"Ionic compounds have high melting points and conduct only when molten or dissolved, because the ions are then free to move.","June 2020 · Chemistry 1 · Q3(c)(ii)"),
m(T_BOND,"How many ions are there in the formula Al₂O₃?",["2","3","5","6"],2,"Two Al³⁺ ions and three O²⁻ ions make 5 ions.","June 2019 · Chemistry 1 · Q4(c)(i)"),
s(T_BOND,"Write the formula of potassium sulfate. It contains K⁺ and SO₄²⁻ ions.","K₂SO₄","June 2019 · Chemistry 1 · Q3(b)(i)"),
s(T_BOND,"Write the formula of sodium sulfate from the ions Na⁺ and SO₄²⁻.","Na₂SO₄","June 2020 · Chemistry 1 · Q5(c)"),
s(T_BOND,"A solid contains only NH₄⁺ and NO₃⁻ ions. Give its formula and its name.","NH₄NO₃, ammonium nitrate.","June 2022 · Chemistry 2 · Q2(b)(v)"),
s(T_BOND,"Give the formula of the barium ion in barium chloride.","Ba²⁺","June 2024 · Chemistry 2 · Q2(b)(v)"),
s(T_BOND,"Give the formula of sodium chloride, which is made of Na⁺ and Cl⁻ ions.","NaCl","June 2023 · Chemistry 2 · Q4(b)(iv)"),
s(T_BOND,"Explain how sodium atoms and chlorine atoms form ions in sodium chloride, and how the ions are arranged in the solid.","Sodium (2.8.1) loses one electron to become Na⁺ (2.8). Chlorine (2.8.7) gains that electron to become Cl⁻ (2.8.8). The oppositely charged ions attract each other strongly (ionic bonding) and are arranged in a regular giant ionic lattice, in a 1:1 ratio.","June 2019 · Chemistry 2 · Q6(d)"),
s(T_BOND,"Describe the differences between ionic bonding and covalent bonding.","Ionic: electrons are transferred from a metal to a non-metal, forming oppositely charged ions held by strong electrostatic attraction. Covalent: non-metal atoms share a pair of electrons, forming molecules.","June 2023 · Chemistry 1 · Q4(d)"),
s(T_BOND,"Why do solid ionic compounds not conduct electricity?","The ions are held in a lattice and cannot move.","June 2023 · Chemistry 1 · Q2(b)(iii)"),
s(T_BOND,"Why must sodium chloride be dissolved (or melted) for electrolysis, rather than used as a solid?","So that the ions are free to move. In the solid they are fixed in place.","June 2018 · Chemistry 1 · Q3(e)(i)"),
s(T_BOND,"A lamp is connected in a circuit with the electrodes in (i) glucose solution and (ii) sodium chloride solution. Predict what happens to the lamp in each.","(i) Glucose: lamp does not light (covalent, no ions). (ii) Sodium chloride: lamp lights (ions are free to move).","June 2020 · Chemistry 2 · Q3(d)"),
s(T_BOND,"Explain why ammonium chloride conducts electricity when dissolved in water but not as a solid.","It contains ions. In the solid the ions cannot move; in solution they are free to move and carry the charge.","June 2021 · Chemistry 2 · Q5(c)"),
s(T_BOND,"Explain why solid magnesium carbonate does not conduct electricity but solid magnesium does.","Magnesium carbonate: its ions are fixed in a lattice and cannot move. Magnesium: has delocalised electrons that are free to move and carry charge.","June 2022 · Chemistry 1 · Q6(a)(ii)"),
s(T_BOND,"Explain why solid sodium carbonate does not conduct electricity but sodium carbonate solution does.","Solid: ions are held in a lattice by strong electrostatic attractions and cannot move. Solution: the ions are free to move.","June 2024 · Chemistry 1 · Q6(a)(ii)"),
s(T_BOND,"Silver nitrate solution and solid silver both conduct electricity. Explain how each conducts.","Silver nitrate solution contains ions that are free to move. Solid silver has delocalised electrons that are free to move. In both cases, moving charged particles carry the current.","June 2025 · Chemistry 1 · Q6(b)"),
s(T_BOND,"Explain why graphite is used for electrodes in electrolysis.","It is unreactive (inert) so does not react with the electrolyte or products, and it conducts electricity.","June 2022 · Chemistry 1 · Q4(c)(ii)"),
s(T_BOND,"Explain, in terms of structure, how graphite conducts electricity.","Graphite has delocalised electrons that are free to move. Ions are not accepted.","June 2022 · Chemistry 1 · Q4(c)(iii)"),
s(T_BOND,"Give two reasons graphite is suitable for use as electrodes.","It does not react (chemically stable or inert), and it conducts electricity.","June 2024 · Chemistry 1 · Q4(c)(i)"),

/* ===== STATES OF MATTER & CHANGES OF STATE ===== */
s(T_STATE,"Describe how the particles are arranged and how they move in a solid compared with a liquid.","Solid: particles are in a regular arrangement, held in fixed positions, and vibrate. Liquid: particles are randomly arranged, further apart and able to move around.","June 2022 · Chemistry 1 · Q1(a)"),
m(T_STATE,"What is the name of the change when a liquid becomes a solid?",["Condensing","Evaporating","Freezing","Melting"],2,"Liquid to solid is freezing.","June 2024 · Chemistry 1 · Q1(b)(i)"),
m(T_STATE,"Which change happens when chocolate goes from a solid to a liquid?",["Condensing","Evaporating","Freezing","Melting"],3,"Solid to liquid is melting.","June 2022 · Chemistry 1 · Q1(b)"),
s(T_STATE,"What is the change of state from solid to liquid called?","Melting.","June 2025 · Chemistry 1 · Q2(a)(i)"),
s(T_STATE,"What is the change of state from liquid to gas called?","Evaporation (boiling and vaporisation are also accepted).","June 2023 · Chemistry 1 · Q1(b)(i)"),
s(T_STATE,"What is the change of state from gas to liquid called?","Condensing (condensation).","June 2020 · Chemistry 1 · Q3(d)(ii)"),
s(T_STATE,"Explain why changing from liquid to solid is a physical change rather than a chemical change.","No new substance is formed, and the change is reversible.","June 2024 · Chemistry 1 · Q1(b)(ii)"),
s(T_STATE,"Give two reasons why changes of state are physical changes rather than chemical changes.","No new substances are formed, and the changes are easily reversed.","June 2018 · Chemistry 1 · Q4(d)"),
m(T_STATE,"Which row describes the movement and arrangement of particles in a gas?",["Slow and regular","Slow and random","Fast and regular","Fast and random"],3,"Gas particles move quickly and randomly, far apart.","June 2024 · Chemistry 1 · Q1(c)(i)"),
s(T_STATE,"Which two statements correctly compare particles in ice and in water?","Particles move faster in water than in ice. Particles are arranged regularly in ice but not in water.","June 2021 · Chemistry 1 · Q1(a)(ii)"),
s(T_STATE,"A metal spoon placed in hot water stays solid. Give a reason.","The melting point of the metal is higher than the temperature of the hot water.","June 2022 · Chemistry 1 · Q1(c)"),
s(T_STATE,"Wax in a water bath at 100 °C does not boil. Suggest why.","Wax has a higher boiling point than water, so boiling water is not hot enough to turn the wax into a gas.","June 2024 · Chemistry 1 · Q1(c)(ii)"),
s(T_STATE,"Egg white is liquid before heating, solid when hot and still solid after cooling. How does this show the change is chemical?","The change is permanent (irreversible): cooling does not turn it back into a liquid, so a new substance has formed.","June 2022 · Chemistry 1 · Q1(d)"),
m(T_STATE,"A substance melts at 114 °C. What state is it in at 20 °C?",["Solid","Liquid","Gas","Plasma"],0,"20 °C is below the melting point of 114 °C, so it is a solid.","June 2019 · Chemistry 1 · Q1(c)(i)"),
m(T_STATE,"A substance melts at −7 °C and boils at 59 °C. What state is it in at 50 °C?",["Solid","Liquid","Gas","Cannot tell"],1,"50 °C is above the melting point and below the boiling point, so it is a liquid.","June 2019 · Chemistry 1 · Q1(c)(ii)"),
m(T_STATE,"Which of these is a mixture?",["Air","Carbon dioxide","Gold","Titanium"],0,"Air contains several gases mixed together. Carbon dioxide is a compound; gold and titanium are elements.","June 2019 · Chemistry 1 · Q2(a)"),

/* ===== SEPARATION, CHROMATOGRAPHY & WATER ===== */
m(T_SEP,"Which method is used to separate the coloured substances in an ink?",["Chromatography","Crystallisation","Filtration","Fractional distillation"],0,"Paper chromatography separates dyes in an ink.","June 2018 · Chemistry 1 · Q4(a)"),
s(T_SEP,"Why is a condenser used in distillation?","It cools the vapour so it condenses back into a liquid.","June 2018 · Chemistry 1 · Q4(b)(ii)"),
s(T_SEP,"Name an alternative to a Bunsen burner for heating a distillation flask.","An electric heater or heating mantle (a hot plate or spirit burner is also accepted).","June 2018 · Chemistry 1 · Q4(b)(iii)"),
s(T_SEP,"Why should the thermometer bulb be level with the side arm of a distillation flask?","So it measures the temperature of the vapour entering the condenser (the boiling point of the substance).","June 2019 · Chemistry 1 · Q2(b)(i)"),
s(T_SEP,"In a distillation, name the equipment that cools the vapour with cold water running around it.","The (Liebig) condenser.","June 2025 · Chemistry 1 · Q2(b)(i)"),
s(T_SEP,"On a chromatogram, one ink gives a single spot. What does this tell you?","The ink contains only one dye (one coloured substance).","June 2023 · Chemistry 1 · Q1(a)(i)"),
s(T_SEP,"Explain how you can tell from a chromatogram which mixture contains the most dyes.","It is the one that produces the most separate spots.","June 2019 · Chemistry 1 · Q2(c)(ii)"),
s(T_SEP,"A dye spot moves 2.30 cm and the solvent front moves 8.00 cm. Calculate the Rf value to 2 decimal places.","Rf = 2.30 ÷ 8.00 = 0.29 (0.2875 before rounding).","June 2019 · Chemistry 1 · Q2(c)(iii)"),
s(T_SEP,"A dye spot moves 3.60 cm and the solvent front moves 9.20 cm. Calculate the Rf value to 2 decimal places.","Rf = 3.60 ÷ 9.20 = 0.39.","June 2023 · Chemistry 1 · Q1(a)(iii)"),
m(T_SEP,"Which is the correct order for treating waste water to make drinking water?",["Chlorination, filtration, sedimentation","Filtration, chlorination, sedimentation","Sedimentation, filtration, chlorination","Sedimentation, chlorination, filtration"],2,"Sedimentation removes large particles, filtration removes small insoluble solids, and chlorination kills microorganisms last.","June 2022 · Chemistry 1 · Q2(a)(i)"),
s(T_SEP,"Why is chlorine added during water treatment?","To kill bacteria (microorganisms).","June 2021 · Chemistry 1 · Q6(b)(iii)"),
s(T_SEP,"What is the purpose of filtration in water treatment?","To remove insoluble solids.","June 2021 · Chemistry 1 · Q6(b)(ii)"),
s(T_SEP,"Describe how sedimentation is carried out.","Leave the water to stand so the solid particles sink to the bottom (a substance such as aluminium sulfate can be added to make particles clump together).","June 2022 · Chemistry 1 · Q2(a)(iii)"),
s(T_SEP,"Potable (drinking) water contains dissolved ions such as chloride, nitrate and sulfate. Explain why it is not pure water.","Pure water contains only one substance. Potable water also contains dissolved ions/salts, so it is a mixture.","June 2022 · Chemistry 1 · Q2(a)(iv)"),
s(T_SEP,"What is the pH of pure water?","pH 7.","June 2021 · Chemistry 1 · Q1(b)(ii)"),
s(T_SEP,"Why is tap water unsuitable for chemical analysis?","It contains dissolved substances (ions) that could affect the results.","June 2024 · Chemistry 1 · Q2(b)(iii)"),
s(T_SEP,"Describe a method to produce pure water from a solution containing a dissolved solid, and how to test that the water is neutral.","Distillation: heat the solution in a flask so the water evaporates; pass the vapour through a condenser with cold water; collect the liquid in a beaker (the solid stays in the flask). Test with universal indicator or a pH probe: neutral water gives pH 7 (green).","June 2021 · Chemistry 1 · Q6(d)"),
s(T_SEP,"Describe how to get a pure, dry sample of an insoluble solid (a precipitate) from a mixture.","Filter the mixture, wash the solid on the filter paper with distilled water, then dry it (in a warm place or oven).","June 2023 · Chemistry 1 · Q3(b)(iii)"),
s(T_SEP,"Describe how to separate a precipitate from its solution.","Filtration: pour the mixture through a funnel with filter paper. The solid stays on the paper and the solution (filtrate) passes through.","June 2025 · Chemistry 1 · Q6(a)(iii)"),
s(T_SEP,"Copper hydroxide is an insoluble solid and sodium sulfate is soluble. Describe how to obtain each from the reaction mixture.","Copper hydroxide: filter, wash with distilled water, dry. Sodium sulfate: pour the filtrate into an evaporating basin, heat to evaporate the water, then dry the solid.","June 2024 · Chemistry 1 · Q4(b)"),
s(T_SEP,"After making a salt using excess insoluble solid, describe how to obtain pure, dry crystals of the salt.","Filter off the excess solid, heat the filtrate to evaporate some water (until saturated), leave to cool so crystals form, then filter off the crystals and dry them (for example between filter paper).","June 2018 · Chemistry 1 · Q5(e)"),
s(T_SEP,"Describe how to obtain a copper sulfate solution from copper carbonate and sulfuric acid, then pure dry crystals.","Add excess copper carbonate to the acid and stir. Filter to remove the excess solid. Heat the filtrate (for example in a water bath) until about half remains or crystals start to form. Leave to cool and crystallise. Filter off the crystals and dry them on absorbent paper in a warm place.","June 2020 · Chemistry 1 · Q6(b)(ii)"),
s(T_SEP,"Why do the masses before and after a precipitation reaction stay the same?","No atoms are lost or gained; the number of atoms is the same, so mass is conserved.","June 2020 · Chemistry 2 · Q2(a)(ii)"),

/* ===== FORMULAE, Mr & CALCULATIONS ===== */
m(T_CALC,"What is the empirical formula of butene, C₄H₈?",["CH","CH₂","C₄H₈","(CH₂)₄"],1,"Divide both numbers by 4 to get the simplest whole-number ratio: CH₂.","June 2018 · Chemistry 1 · Q2(a)"),
s(T_CALC,"Calculate the relative formula mass of C₄H₈ (H = 1, C = 12).","4 × 12 + 8 × 1 = 56.","June 2018 · Chemistry 1 · Q2(b)"),
s(T_CALC,"Balance the equation: C₄H₈ + 6O₂ → ___CO₂ + ___H₂O","C₄H₈ + 6O₂ → 4CO₂ + 4H₂O","June 2018 · Chemistry 1 · Q2(c)(i)"),
s(T_CALC,"Give the molecular formula and empirical formula of ethene.","Molecular formula C₂H₄; empirical formula CH₂.","June 2021 · Chemistry 1 · Q5(b)"),
s(T_CALC,"Calculate the relative formula mass of chromium oxide, Cr₂O₃ (Cr = 52, O = 16).","(2 × 52) + (3 × 16) = 152.","June 2021 · Chemistry 1 · Q2(a)(iii)"),
s(T_CALC,"Calculate the relative formula mass of CuCO₃ (C = 12.0, O = 16.0, Cu = 63.5).","63.5 + 12 + (3 × 16) = 123.5.","June 2020 · Chemistry 1 · Q6(a)(ii)"),
s(T_CALC,"Calculate the relative formula mass of Zn(NO₃)₂ (Zn = 65, N = 14, O = 16).","65 + 2 × (14 + 3 × 16) = 189.","June 2025 · Chemistry 1 · Q3(c)(i)"),
m(T_CALC,"A hydrocarbon has the formula C₃H₈. What is its relative formula mass (H = 1.0, C = 12)?",["13","42","44","96"],2,"3 × 12 + 8 × 1 = 44.","June 2022 · Chemistry 2 · Q3(a)(iii)"),
s(T_CALC,"Calculate the percentage by mass of magnesium in magnesium carbonate, MgCO₃ (C = 12.0, O = 16.0, Mg = 24.0).","Mr = 24.0 + 12.0 + 3 × 16.0 = 84.0. 24.0 ÷ 84.0 × 100 = 28.6 %.","June 2022 · Chemistry 1 · Q6(b)"),
s(T_CALC,"Calculate the percentage by mass of sodium in sodium carbonate, Na₂CO₃ (Na = 23, C = 12, O = 16).","Mr = 106. 46 ÷ 106 × 100 = 43.4 %.","June 2024 · Chemistry 1 · Q6(b)"),
s(T_CALC,"Calculate the percentage by mass of hydrogen in LiOH (Li = 7, O = 16, H = 1.0).","Mr = 7 + 16 + 1 = 24. 1 ÷ 24 × 100 = 4.17 %.","June 2025 · Chemistry 2 · Q4(b)(v)"),
s(T_CALC,"An ore contains 10 050 kg of iron in 25 000 kg of ore. Calculate the percentage of iron in the ore.","10 050 ÷ 25 000 × 100 = 40.2 %.","June 2025 · Chemistry 1 · Q4(b)"),
s(T_CALC,"A copper ore of mass 5000 kg contains 42.5 kg of copper. Calculate the percentage of copper in the ore.","42.5 ÷ 5000 × 100 = 0.85 %.","June 2020 · Chemistry 1 · Q4(d)"),
s(T_CALC,"Potassium bromide is 32.8 % potassium by mass. Calculate the masses of potassium and bromine in 500 g of potassium bromide.","Potassium: 0.328 × 500 = 164 g. Bromine: 500 − 164 = 336 g.","June 2024 · Chemistry 2 · Q4(d)"),
s(T_CALC,"Iron chloride is 34.4 % iron by mass. Calculate the masses of iron and chlorine in 125 g of iron chloride.","Iron: 34.4 % × 125 = 43 g. Chlorine: 125 − 43 = 82 g.","June 2022 · Chemistry 2 · Q4(b)(iii)"),
s(T_CALC,"Calculate the mass of carbon in 100 g of butane, C₄H₁₀ (Mr = 58.0, Ar of C = 12.0). Give your answer to 3 significant figures.","(4 × 12.0) ÷ 58.0 × 100 = 82.8 g.","June 2019 · Chemistry 2 · Q5(c)(ii)"),
s(T_CALC,"12 g of titanium combines with 8.0 g of oxygen (Ti = 48, O = 16). Find the empirical formula.","Ti: 12 ÷ 48 = 0.25. O: 8.0 ÷ 16 = 0.5. Ratio 1 : 2, so TiO₂.","June 2020 · Chemistry 1 · Q4(f)"),
s(T_CALC,"3.5 g of element A (Ar = 7) combines with 4.0 g of element G (Ar = 16). Find the empirical formula.","A: 3.5 ÷ 7 = 0.5. G: 4.0 ÷ 16 = 0.25. Ratio 2 : 1, so A₂G.","June 2019 · Chemistry 1 · Q5(d)"),
s(T_CALC,"1.35 g of aluminium reacts with 12.00 g of bromine (Al = 27.0, Br = 80.0). Find the empirical formula of aluminium bromide.","Al: 1.35 ÷ 27.0 = 0.05. Br: 12.00 ÷ 80.0 = 0.15. Ratio 1 : 3, so AlBr₃.","June 2022 · Chemistry 1 · Q3(b)"),
s(T_CALC,"1.20 g of magnesium combines with 3.55 g of chlorine (Mg = 24.0, Cl = 35.5). Find the empirical formula.","Mg: 1.20 ÷ 24.0 = 0.05. Cl: 3.55 ÷ 35.5 = 0.1. Ratio 1 : 2, so MgCl₂.","June 2023 · Chemistry 1 · Q4(c)"),
s(T_CALC,"1.4 g of silicon combines with 7.1 g of chlorine (Si = 28, Cl = 35.5). Find the empirical formula.","Si: 1.4 ÷ 28 = 0.05. Cl: 7.1 ÷ 35.5 = 0.2. Ratio 1 : 4, so SiCl₄.","June 2024 · Chemistry 1 · Q3(b)"),
s(T_CALC,"0.92 g of sodium combines with 0.32 g of oxygen (Na = 23, O = 16). Find the empirical formula of sodium oxide.","Na: 0.92 ÷ 23 = 0.04. O: 0.32 ÷ 16 = 0.02. Ratio 2 : 1, so Na₂O.","June 2018 · Chemistry 2 · Q6(a)"),
s(T_CALC,"1.19 g of tin combines with 1.42 g of chlorine (Sn = 119.0, Cl = 35.5). Find the empirical formula of tin chloride.","Sn: 1.19 ÷ 119 = 0.01. Cl: 1.42 ÷ 35.5 = 0.04. Ratio 1 : 4, so SnCl₄.","June 2021 · Chemistry 2 · Q3(b)"),
s(T_CALC,"A hydrocarbon contains 0.96 g of carbon and 0.32 g of hydrogen (C = 12, H = 1.0). Find its empirical formula.","C: 0.96 ÷ 12 = 0.08. H: 0.32 ÷ 1.0 = 0.32. Ratio 1 : 4, so CH₄.","June 2025 · Chemistry 2 · Q6(c)"),
s(T_CALC,"Calculate the maximum mass of iron from 240 tonnes of iron oxide, Fe₂O₃ (Fe = 56, O = 16).","Mr(Fe₂O₃) = 160, so 160 t gives 112 t of iron. 240 × 112 ÷ 160 = 168 tonnes.","June 2018 · Chemistry 1 · Q6(a)(ii)"),
s(T_CALC,"Copper oxide (159.0 g) gives 127.0 g of copper. Calculate the mass of copper from 238.5 g of copper oxide.","238.5 × (127.0 ÷ 159.0) = 190.5 g.","June 2025 · Chemistry 1 · Q4(c)(iii)"),
s(T_CALC,"Calculate the maximum mass of magnesium oxide made from 1.35 g of magnesium: 2Mg + O₂ → 2MgO (Mg = 24.0, O = 16.0).","Moles Mg = 1.35 ÷ 24 = 0.05625. Mr(MgO) = 40, so mass = 0.05625 × 40 = 2.25 g.","June 2019 · Chemistry 2 · Q6(b)"),
s(T_CALC,"Dodecane (Mr 170) cracks to octane (Mr 114) in a 1 : 1 reaction. Calculate the maximum mass of octane from 340 g of dodecane.","340 ÷ 170 × 114 = 228 g.","June 2020 · Chemistry 2 · Q4(d)(ii)"),
s(T_CALC,"When 5.000 g of calcium carbonate is heated, 2.800 g of solid is left. Calculate the mass of carbon dioxide released, to 3 significant figures.","5.000 − 2.800 = 2.20 g.","June 2022 · Chemistry 2 · Q6(c)"),
s(T_CALC,"The mass of zinc carbonate before heating is 17.83 g and after heating is 14.62 g. Calculate the mass lost.","17.83 − 14.62 = 3.21 g.","June 2025 · Chemistry 1 · Q1(d)(i)"),
s(T_CALC,"Calculate the concentration, in g/dm³, of a solution containing 23.5 g of nickel sulfate in 250 cm³.","23.5 ÷ 250 × 1000 = 94 g/dm³.","June 2018 · Chemistry 1 · Q5(d)"),
s(T_CALC,"28.4 g of sodium sulfate is dissolved to make 250 cm³ of solution. Calculate the concentration in g/dm³ to 3 significant figures.","28.4 ÷ 0.250 = 113.6, so 114 g/dm³.","June 2020 · Chemistry 1 · Q5(b)"),
s(T_CALC,"3.14 g of copper sulfate is made up to 250 cm³ of solution. Calculate the concentration in g/dm³.","3.14 ÷ 0.250 = 12.56 g/dm³.","June 2022 · Chemistry 1 · Q4(a)"),
s(T_CALC,"6.52 g of copper sulfate is dissolved to make 250 cm³ of solution. Calculate the concentration in g/dm³.","6.52 × 4 = 26.08 g/dm³.","June 2024 · Chemistry 1 · Q4(a)"),
s(T_CALC,"23.8 g of zinc sulfate is dissolved to make 250 cm³ of solution. Calculate the concentration in g/dm³ to 2 significant figures.","23.8 ÷ 0.25 = 95.2, so 95 g/dm³.","June 2025 · Chemistry 1 · Q4(d)"),
s(T_CALC,"9.25 g of ammonium chloride is dissolved in 200 cm³ of water. Calculate the concentration in g/dm³.","200 cm³ = 0.200 dm³. 9.25 ÷ 0.200 = 46.25 g/dm³.","June 2021 · Chemistry 2 · Q5(a)"),
s(T_CALC,"A solution has a concentration of 12 g/dm³. Calculate the volume, in cm³, that contains 9.0 g of the solute.","9.0 ÷ 12 = 0.75 dm³ = 750 cm³.","June 2019 · Chemistry 2 · Q3(e)"),
s(T_CALC,"Calculate the mass of solid in 25 cm³ of a solution with concentration 26.8 g/dm³.","25 cm³ = 0.025 dm³. 0.025 × 26.8 = 0.67 g.","June 2025 · Chemistry 2 · Q5(c)"),
s(T_CALC,"Bottled water contains 60 mg of calcium ions in 1000 cm³. Calculate the mass of calcium ions in 250 cm³.","60 × 250 ÷ 1000 = 15 mg.","June 2021 · Chemistry 1 · Q1(b)(iii)"),
s(T_CALC,"Three results for the mass of product are 5.22 g, 5.24 g and 5.21 g. Calculate the mean to 2 decimal places.","(5.22 + 5.24 + 5.21) ÷ 3 = 5.2233, so 5.22 g.","June 2019 · Chemistry 1 · Q3(b)(ii)"),
s(T_CALC,"Three precipitate heights are 2.4 cm, 2.4 cm and 2.7 cm. Calculate the mean height.","(2.4 + 2.4 + 2.7) ÷ 3 = 7.5 ÷ 3 = 2.5 cm.","June 2023 · Chemistry 1 · Q3(b)(ii)"),
s(T_CALC,"A reaction takes place at a pressure of 200 atmospheres. Convert this to pascals (1 atmosphere = 101 325 Pa).","200 × 101 325 = 20 265 000 Pa.","June 2021 · Chemistry 1 · Q3(c)"),

/* ===== ACIDS, ALKALIS, SALTS & TESTS ===== */

s(T_ACID,"What is the pH of a neutral sodium chloride solution?","pH 7.","June 2020 · Chemistry 1 · Q1(c)(ii)"),
s(T_ACID,"Name a piece of equipment that measures pH more accurately than universal indicator paper.","A pH meter (pH probe).","June 2024 · Chemistry 1 · Q5(b)(i)"),
s(T_ACID,"Describe how universal indicator paper is used to find the pH of a solution.","Dip the paper into the solution and compare the colour it turns with the pH colour chart.","June 2022 · Chemistry 1 · Q5(b)(ii)"),
s(T_ACID,"Explain why litmus paper is not suitable for finding how strongly acidic a solution is.","Litmus only shows whether a solution is acidic or alkaline. It does not give a pH value or a range of colours.","June 2022 · Chemistry 1 · Q5(b)(iii)"),
s(T_ACID,"What type of reaction is acid + base?","Neutralisation.","June 2020 · Chemistry 1 · Q3(b)(ii)"),
s(T_ACID,"Name the salt formed when aluminium oxide reacts with hydrochloric acid.","Aluminium chloride.","June 2020 · Chemistry 1 · Q3(b)(i)"),
s(T_ACID,"Which acid is used to make chlorides?","Hydrochloric acid.","June 2018 · Chemistry 1 · Q5(b)"),

s(T_METAL,"Using the reactivity series, state and explain how aluminium, iron, silver and gold are extracted.","Aluminium: electrolysis, because it is more reactive than carbon (so carbon reduction will not work); this uses a lot of energy and is expensive. Iron: heat the ore with carbon, because iron is less reactive than carbon and this is cheaper than electrolysis. Silver: found uncombined (or reduced by heating with carbon). Gold: found uncombined because it is the least reactive, so no reduction is needed.","June 2023 · Chemistry 1 · Q6(c)"),

s(T_ELEC,"Sodium chloride solution contains Na⁺, Cl⁻, H⁺ and OH⁻ ions. Which two are attracted to the positive electrode (anode)?","Cl⁻ and OH⁻.","June 2018 · Chemistry 1 · Q3(e)(ii)"),

s(T_ELEC,"During the electrolysis of water the volume of hydrogen collected is 4 cm³, 8 cm³, 12 cm³ and 16 cm³, while oxygen is 2, 4, 6 and 8 cm³. Describe the relationship.","The volume of hydrogen is always twice the volume of oxygen (a 2 : 1 ratio).","June 2019 · Chemistry 1 · Q6(a)(ii)"),

s(T_ELEC,"Impure copper is purified by electrolysis in copper sulfate solution. Explain what happens at each electrode and why the solution stays blue.","The impure copper anode loses mass: Cu atoms lose electrons to form Cu²⁺ ions. Cu²⁺ ions move to the cathode and gain electrons to form copper, so the pure cathode gains mass. Impurities fall from the anode as a solid. Copper ions enter the solution at the anode at the same rate they leave at the cathode, so the colour and concentration stay the same.","June 2019 · Chemistry 1 · Q6(d)"),

/* ---- mastery ---- */
function mastery(id) {
  const t = T(id), d = tp(id), n = t.cards.length;
  let cm = 0; for (let i = 0; i < n; i++) cm += Math.min(d.cards[i] || 0, 3) / 3; cm = n ? cm / n : 0;
  const qa = d.acc == null ? 0 : d.acc * Math.min(1, d.n / 6);
  const ws = Math.min(1, d.ws / 3);
  const ex = examFrac(id);
  const total = .07 * (d.notes ? 1 : 0) + .03 * (d.slides ? 1 : 0) + .07 * ws + .2 * cm + .45 * qa + .18 * ex;
  const started = !!(d.notes || d.slides || d.ws || cm > 0 || d.n > 0 || ex > 0);
  return {total, cm, qa, ws, ex, started, know:.55 * qa + .25 * cm + .2 * ex};
}
const secMastery = sid => { const ts = SEC(sid).topics; return ts.reduce((a, t) => a + mastery(t.id).total, 0) / ts.length; };

const GRADE_CUTS = [[80, 5], [62, 4], [45, 3], [30, 2], [15, 1]];
function gradeOf(p) { for (const [c, g] of GRADE_CUTS) if (p >= c) return g; return 0; }
function paperAvg(sid) {
  const v = PAPERS.filter(p => p.sec === sid && S.papers[p.id] != null).map(p => S.papers[p.id] / 60);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function predicted() {
  const per = SECS.map(s => {
    const know = s.topics.reduce((a, t) => a + mastery(t.id).know, 0) / s.topics.length;
    const pa = paperAvg(s.id);
    const score = pa == null ? know * 100 : (know * .5 + pa * .5) * 100;
    return {id:s.id, name:s.name, score, grade:gradeOf(score), paper:pa, started:s.topics.filter(t => mastery(t.id).started).length, total:s.topics.length};
  });
  const score = per.reduce((a, p) => a + p.score, 0) / per.length;
  const coverage = per.reduce((a, p) => a + p.started, 0) / ALL.length;
  const g = gradeOf(score), next = GRADE_CUTS.slice().reverse().find(c => c[0] > score);
  return {per, score, grade:g, coverage, toNext:next ? Math.ceil(next[0] - score) : 0, nextGrade:next ? next[1] : null};
}
const gradeText = g => g ? g + '-' + g : 'U';

function rankTopics() {

  return {strong:started.filter(x => x.m.total > .15).slice(0, 3), weak:weakest.slice(0, 3)};
}

  p4() { const f = pick([10, 20, 50, 100, 200]), l = pick([0.5, 1, 2, 3]);
    return {q:`A wave has frequency ${f} Hz and wavelength ${l} m. Find its speed.`, steps:[`v = f × λ`, `= ${f} × ${l}`], ans:f * l, unit:'m/s'}; },
  p5() { const a = pick([400, 800, 1200, 1600]), h = pick([2, 3, 5, 10]), n = rnd(2, 4), steps = [`Half-lives = ${h * n} ÷ ${h} = ${n}`];
    let x = a; for (let i = 1; i <= n; i++) { x = x / 2; steps.push(`After ${i}: ${x}`); }
    return {q:`A source has activity ${a} Bq and half-life ${h} hours. What is the activity after ${h * n} hours?`, steps, ans:x, unit:'Bq'}; },
  p6() { const m = pick([60, 120, 240, 300]), v = pick([10, 20, 30, 40]);
    return {q:`A block has mass ${m} g and volume ${v} cm³. Find its density in g/cm³ (2 d.p.).`, steps:[`Density = mass ÷ volume`, `= ${m} ÷ ${v}`], ans:r2(m / v), unit:'g/cm³'}; },
  b4() { const v = pick([3, 6, 9, 12]), t = pick([10, 15, 20, 30]);
    return {q:`A respirometer shows ${v} cm³ of oxygen used in ${t} minutes. Calculate the rate of respiration in cm³ per minute (2 d.p.).`, steps:[`Rate = volume ÷ time`, `= ${v} ÷ ${t}`], ans:r2(v / t), unit:'cm³/min'}; },
  b8() { const w = pick([70, 80, 90, 100]), h = pick([90, 100, 110]);
    return {q:`A person has a waist of ${w} cm and hips of ${h} cm. Calculate the waist:hip ratio (2 d.p.).`, steps:[`Ratio = waist ÷ hip`, `= ${w} ÷ ${h}`], ans:r2(w / h), unit:''}; },
  b11() { const v = pick([1.2, 2.4, 3.6, 4.8]), m = pick([10, 20, 30, 40]);
    return {q:`A shoot takes in ${v} cm³ of water in ${m} minutes. Calculate the rate of water uptake in cm³ per hour.`, steps:[`${m} minutes = ${m} ÷ 60 hours`, `Rate = volume ÷ time`, `= ${v} ÷ (${m} ÷ 60)`], ans:r2(v * 60 / m), unit:'cm³/h'}; },
  b12() { const sv = pick([60, 65, 70, 75]), hr = pick([60, 70, 72, 80]);
    return {q:`A heart pumps ${sv} cm³ of blood per beat at ${hr} beats per minute. Calculate the cardiac output in cm³ per minute.`, steps:[`Cardiac output = stroke volume × heart rate`, `= ${sv} × ${hr}`], ans:sv * hr, unit:'cm³/min'}; },
  b13() { const m = pick([3, 4, 5, 6]), a = pick([100, 200, 400]);
    return {q:`The mean number of daisies per 1 m² quadrat is ${m}. The field is ${a} m². Estimate the population.`, steps:[`Population = mean per quadrat × (field area ÷ quadrat area)`, `= ${m} × (${a} ÷ 1)`], ans:m * a, unit:''}; },
  c9() { const c = pick([['H₂O', '(Ar: H = 1, O = 16)', '(2 × 1) + 16', 18], ['CO₂', '(Ar: C = 12, O = 16)', '12 + (2 × 16)', 44], ['CaCO₃', '(Ar: Ca = 40, C = 12, O = 16)', '40 + 12 + (3 × 16)', 100], ['NaOH', '(Ar: Na = 23, O = 16, H = 1)', '23 + 16 + 1', 40], ['MgO', '(Ar: Mg = 24, O = 16)', '24 + 16', 40]]);
    return {q:`Calculate the relative formula mass (Mr) of ${c[0]} ${c[1]}.`, steps:[`Mr = sum of the Ar values for all atoms`, `= ${c[2]}`], ans:c[3], unit:''}; },
  p6() { const k = rnd(0, 1);
    if (k === 0) { const m = pick([0.5, 1, 2, 3]), d = pick([2, 5, 10]);
      return {q:`How much energy is needed to raise the temperature of ${m} kg of water by ${d} °C? (c = 4200 J/kg °C)`, steps:[`ΔE = m × c × Δθ`, `= ${m} × 4200 × ${d}`], ans:m * 4200 * d, unit:'J'}; }
    const m = pick([60, 120, 240, 300]), v = pick([10, 20, 30, 40]);
    return {q:`A block has mass ${m} g and volume ${v} cm³. Find its density in g/cm³ (2 d.p.).`, steps:[`Density = mass ÷ volume`, `= ${m} ÷ ${v}`], ans:r2(m / v), unit:'g/cm³'}; },
  p8() { if (Math.random() < .5) { const f = pick([20, 40, 50, 60]), d = pick([2, 5, 6, 10]);
      return {q:`A force of ${f} N moves an object ${d} m in the direction of the force. Calculate the work done.`, steps:[`Work done = force × distance`, `= ${f} × ${d}`], ans:f * d, unit:'J'}; }
    const e = pick([600, 900, 1500, 2400]), t = pick([6, 10, 20, 30]);
    return {q:`A machine transfers ${e} J of energy in ${t} s. Calculate its power.`, steps:[`Power = work done ÷ time`, `= ${e} ÷ ${t}`], ans:r2(e / t), unit:'W'}; },
  p9() { const f = pick([6, 10, 12, 20]), x = pick([0.02, 0.04, 0.05, 0.1]);
    return {q:`A force of ${f} N stretches a spring by ${x} m. Calculate the spring constant.`, steps:[`F = k × x, so k = F ÷ x`, `= ${f} ÷ ${x}`], ans:r2(f / x), unit:'N/m'}; },
  p10() { const c = pick([[10, 2, 100], [20, 5, 100], [230, 1, 23], [12, 5, 60]]);
    return {q:`A 100% efficient transformer has a primary of ${c[0]} V and ${c[1]} A. The secondary voltage is ${c[2]} V. Calculate the secondary current.`, steps:[`Vp × Ip = Vs × Is`, `${c[0]} × ${c[1]} = ${c[2]} × Is`, `Is = ${c[0] * c[1]} ÷ ${c[2]}`], ans:r2(c[0] * c[1] / c[2]), unit:'A'}; }
};
const checkNum = (inp, ans) => Math.abs(inp - ans) <= Math.max(0.011, Math.abs(ans) * 0.015);

function back() { const h = hist.pop(); if (h) { view = h.view; P = h.P; } else { view = 'home'; P = {}; } render(); window.scrollTo(0, 0); }

function render() {

/* ---------- Planner ---------- */
const SESS_TYPES = [
  {name:'Learn: notes and slides', tab:'notes'}, {name:'Flashcards', tab:'cards'}, {name:'Worksheet', tab:'sheet'},
  {name:'Topic quiz', tab:'quiz'}, {name:'Recap quiz', tab:'quiz'}
];
const subtract = (wins, a, b) => wins.flatMap(w => (b <= w[0] || a >= w[1]) ? [w] : [[w[0], Math.max(w[0], a)], [Math.min(w[1], b), w[1]]].filter(x => x[1] - x[0] > 0));
function startStage(id) {
  const d = tp(id), m = mastery(id);
  if (!d.notes) return 0; if (m.cm < .6) return 1; if (d.ws < 3 && (GEN[id] || T(id).work.length)) return 2; if (!(d.acc != null && d.acc >= .8 && d.n >= 6)) return 3; return 4;
}
function topicQueue(Pf) {
  const reps = id => { const mm = mastery(id).total; return mm < .35 ? 3 : mm < .7 ? 2 : (mm < .85 || Pf.mode === 'paper') ? 1 : 0; };
  const q = [];
  for (let r = 0; r < 3; r++) {
    const lists = Pf.order.map(sid => {
      let ts = SEC(sid).topics.slice(); if (Pf.mode === 'weak') ts.sort((a, b) => mastery(a.id).total - mastery(b.id).total);
      return ts.filter(t => reps(t.id) > r).map(t => t.id);
    });
    let more = true; while (more) { more = false; lists.forEach(l => { if (l.length) { q.push(l.shift()); more = true; } }); }
  }
  return q;
}
function buildPlan() {
  const Pf = S.prefs, now = new Date(), nowMin = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 5) * 5, kept = (S.plan ? S.plan.sessions : []).filter(s => s.done && s.date >= today());
  const sessions = kept.slice(), queue = topicQueue(Pf), seen = {};
  kept.forEach(s => { seen[s.tid] = (seen[s.tid] || 0) + 1; });
  for (let i = 0; i < 7; i++) {
    const day = new Date(); day.setDate(day.getDate() + i); const k = dkey(day), wd = day.getDay(), wkend = wd === 0 || wd === 6;
    let wins = [[wkend ? toMin(Pf.wkStart) : toMin(Pf.schoolEnd) + Pf.buffer, toMin(Pf.evenEnd)]];
    Pf.fixed.filter(f => f.days.includes(wd)).forEach(f => { wins = subtract(wins, toMin(f.s), toMin(f.e)); });
    if (i === 0) wins = subtract(wins, 0, nowMin);
    kept.filter(s => s.date === k).forEach(s => { wins = subtract(wins, s.s, s.e + Pf.brk); });
    let count = kept.filter(s => s.date === k).length; const cap = wkend ? Pf.maxWk : Pf.maxWd;
    for (const w of wins) {
      let t = w[0];
      while (count < cap && w[1] - t >= 25) {
        const len = Math.min(Pf.len, w[1] - t); if (len < 25) break;
        const tid = queue.length ? queue.shift() : pick(ALL).id, occ = seen[tid] || 0; seen[tid] = occ + 1;
        const type = Math.min(4, startStage(tid) + occ);
        sessions.push({id:'s' + k + '-' + t, date:k, s:t, e:t + len, tid, type, done:false});
        count++; t += len + Pf.brk;
      }
    }
  }
  sessions.sort((a, b) => a.date.localeCompare(b.date) || a.s - b.s);
  S.plan = {built:today(), sessions}; save();
}
function nextSession() {
  if (!S.plan) return null; const now = new Date(), nm = now.getHours() * 60 + now.getMinutes(), t = today();
  return S.plan.sessions.find(s => !s.done && (s.date > t || (s.date === t && s.e >= nm))) || null;
}

  <section class="stack"><h2>Badges</h2><div class="grid3">${BADGES.map(b => `<div class="badge ${S.badges[b.id] ? '' : 'locked'}"><span class="bi">${ic(b.i)}</span>${b.n}</div>`).join('')}</div></section>
  <section class="card stack"><h3>Your name</h3><div class="row"><input class="field" id="namefield" data-name="1" value="${esc(myName())}" aria-label="Your name" autocomplete="off"><button class="btn" data-a="sayHi">${ic('speaker')}Say it</button></div></section>
  <section class="card stack"><h3>Your data</h3><p class="small muted">Progress is saved in this browser only.</p>
    ${P.reset ? `<div class="row"><button class="btn" style="border-color:var(--bad);color:var(--bad)" data-a="resetDo">Yes, erase everything</button><button class="btn" data-a="resetAsk">Cancel</button></div>` : `<button class="btn" data-a="resetAsk">Reset progress</button>`}</section>`;
}

/* ---------- Papers hub ---------- */
const PAPER_SERIES = ['June 2025', 'June 2024', 'June 2023', 'June 2022', 'November 2021', 'November 2020', 'June 2019', 'June 2018'];
const PMT_SERIES = ['June 2025', 'June 2024', 'June 2023', 'June 2022', 'June 2021', 'June 2020', 'June 2019', 'June 2018', 'Specimen'];
const PMT_PAPERS = [['Biology', 1], ['Biology', 2], ['Chemistry', 1], ['Chemistry', 2], ['Physics', 1], ['Physics', 2]];
const pmtUrl = (sub, n, series, kind) => 'https://www.physicsandmathstutor.com/pdf-pages/?pdf=' + encodeURIComponent(`https://pmt.physicsandmathstutor.com/download/Science/GCSE/Past-Papers/Edexcel/${sub}-${n}F/${series} ${kind} - ${sub} ${n} (F) Edexcel Science GCSE.pdf`);
const lnk = (u, t) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`;
function vPapers() {
  return `<div class="top"><button class="iconbtn" data-a="back" aria-label="Back">${ic('back')}</button><h1>Past papers</h1></div>
  <section class="card stack"><h3>Where the papers are</h3><p class="small muted">Edexcel GCSE Combined Science (1SC0) has six Foundation papers (1BF, 1CF, 1PF, 2BF, 2CF, 2PF), 1 hour 10 minutes and 60 marks each. Question papers and mark schemes are separate downloads. They open on the original sites, so nothing is copied into this app. Pick a paper below, or browse the two sites.</p>
    <a class="btn primary block" href="${LINKS.revsci}" target="_blank" rel="noopener noreferrer">${ic('link')}Revision Science: all papers and mark schemes</a>
    <a class="btn block" href="${LINKS.genie}" target="_blank" rel="noopener noreferrer">${ic('link')}Maths Genie: all papers and mark schemes</a>
    <div class="small muted">Both cover ${PAPER_SERIES.join(', ')}. Pick the Foundation Tier entries.</div></section>
  <section class="card stack"><h3>Practise the papers</h3><p class="small muted">Reworded past-paper questions grouped by topic, with links to the original papers and mark schemes.</p><button class="btn primary" data-a="pq">Past-paper quizzes</button><button class="btn" data-a="spec">Spec checklist</button></section>
  <section class="card stack"><h3>All Foundation papers</h3><p class="small muted">June 2018 to June 2025 plus the specimen paper, each with its mark scheme. Links open on Physics &amp; Maths Tutor.</p>
    ${PMT_PAPERS.map((pp, i) => { const sec = pp[0] === 'Biology' ? 'bio' : pp[0] === 'Chemistry' ? 'chem' : 'phys';
      return `<details class="subj ${sec}" style="border-left:5px solid var(--c);padding-left:10px"><summary style="cursor:pointer;min-height:48px;display:flex;align-items:center;gap:10px"><span class="chip num">Paper ${i + 1}</span><b>${pp[0]} ${pp[1]}</b></summary>
      <div class="stack" style="gap:6px;padding:4px 0 10px">${PMT_SERIES.map(se => `<div class="row"><span class="grow small"><b>${se}</b></span>${lnk(pmtUrl(pp[0], pp[1], se, 'QP'), 'Paper')}<span class="muted">·</span>${lnk(pmtUrl(pp[0], pp[1], se, 'MS'), 'Mark scheme')}</div>`).join('')}</div></details>`; }).join('')}</section>  <section class="card stack"><h3>Paper order and score tracker</h3><p class="small muted">Work through the papers in this order, mark them with the scheme, then log your score out of 60. Scores feed your predicted grade.</p>
    ${PAPERS.map((p, i) => `<div class="row subj ${p.sec}" style="border-left:5px solid var(--c);padding-left:10px"><span class="chip num">Paper ${i + 1}</span><div class="grow"><b>${p.name}</b><div class="small muted">1SC0/${p.id}F · ${S.papers[p.id] != null ? Math.round(S.papers[p.id] / 60 * 100) + '%' : 'not logged'}</div></div>
      <input class="field" style="width:76px" type="number" min="0" max="60" inputmode="numeric" placeholder="/60" value="${S.papers[p.id] != null ? S.papers[p.id] : ''}" data-paper="${p.id}" aria-label="${p.name} score out of 60"></div>`).join('')}</section>
  <section class="card stack"><h3>What each paper covers</h3><p class="small muted">From the Edexcel 1SC0 specification. Each paper is 1 hour 10 minutes, 60 marks, six questions, and Foundation targets grades 1 to 5.</p>
    ${PAPERS.map(p => `<div class="stack subj ${p.sec}" style="gap:6px;border-left:5px solid var(--c);padding-left:10px"><b>Paper ${p.n}: ${p.name}</b><div class="small muted">${ALL.filter(t => t.paper.includes(p.n)).map(t => t.title).join(' · ')}</div></div>`).join('')}
    <button class="btn" data-a="learnSecGo" data-s="paper">See topics by paper</button></section>`;
}

/* ---------- Actions ---------- */
const GSTEP = {};
function act(a, d) {
  const topicNow = () => P.id && T(P.id);
  switch (a) {
    case 'sayHi': { const n = myName(); if (!speak('Hello ' + n + '! Welcome to Re-Vision.')) toast('Hello ' + n + '! (This browser has no speech.)'); else toast('Hello ' + n + '!'); return; }
    case 'tab': return tabTo(d.v);
    case 'go': return go(d.v);
    case 'back': return back();
    case 'closeModal': { const m = document.querySelector('.modal'); if (m) m.remove(); return; }
    case 'topic': return go('topic', {id:d.id, tab:d.tab || 'notes'});
    case 'ttab': P.tab = d.tab; if (d.id && d.id !== P.id) P.id = d.id; render(); return;
    case 'learnSec': P.sec = d.s; return render();
    case 'learnSecGo': return go('learn', {sec:d.s});
    case 'read': { const t = tp(d.id); if (!t.notes) { t.notes = 1; award(10); } return render(); }
    case 'rev': REV[d.k] = (REV[d.k] || 0) + 1; return render();
    case 'revr': REV[d.k] = 0; return render();
    case 'fact': S.facts = rnd(0, 500); save(); return render();
    case 'editGoals': CAL.edit = !CAL.edit; return render();
    case 'goalAdj': { const m = GOAL_META.find(x => x.key === d.k), v = S.goals[d.k] + (+d.d) * m.step; S.goals[d.k] = Math.max(m.min, Math.min(m.max, v));
      const rec = dayRec(); if (+d.d) rec.g = goalSnap(); checkQuests(); save(); return render(); }
    case 'goalAuto': S.goals.auto = S.goals.auto ? 0 : 1; save(); return render();
    case 'calMonth': { const x = new Date(CAL.y, CAL.m + (+d.d), 1); CAL.y = x.getFullYear(); CAL.m = x.getMonth(); return render(); }
    case 'calDay': CAL.sel = d.k; return render();
    /* cards */
    case 'cardsStart': return startCards(d.id || P.id);
    case 'flip': { if (!C || !C.queue.length) return; C.flip = !C.flip; const el = $('.fc'); if (el) el.classList.toggle('flip', C.flip); const b = $('#cbtns'); if (b) b.innerHTML = cardBtns(); return; }
    case 'got': case 'nope': {
      if (!C || !C.queue.length || !C.flip) return;
      const i = C.queue[0], dd = tp(C.id), got = a === 'got';
      dayRec().c++;
      if (got) { dd.cards[i] = Math.min(4, (dd.cards[i] || 0) + 1); C.queue.shift(); C.known++; award(2, true); }
      else { dd.cards[i] = 0; if (C.queue.length > 1) C.queue.push(C.queue.shift()); }
      C.flip = false;
      if (!C.queue.length) award(10 + (C.review ? 0 : 5), true);
      checkQuests(); save(); return render();
    }
    case 'matchStart': return startMatch(d.id || P.id);
    case 'mt': {
      if (!M || M.fin || M.gone[d.k]) return;
      if (!M.sel || M.sel[0] === d.k[0]) { M.sel = d.k; return render(); }
      M.moves++; const a1 = M.sel, b1 = d.k;
      if (a1.slice(1) === b1.slice(1)) { M.gone[a1] = M.gone[b1] = 1; M.found++; M.sel = null;
        if (M.found === M.n) { M.fin = true; M.secs = Math.round((Date.now() - M.t0) / 1000); M.xp = 15 + (M.moves <= M.n + 2 ? 10 : 0); award(M.xp, true); save(); }
        return render(); }
      M.bad = [a1, b1]; M.sel = null; render(); setTimeout(() => { if (M) { M.bad = null; if (view === 'match') render(); } }, 400); return;
    }
    /* quiz */
    case 'quizStart': { const id = d.id || P.id; return startQuiz(qItems([id]), {title:T(id).title, mode:'topic', tid:id, ids:[id]}); }
    case 'quizMixed': return startQuiz(qItems(ALL.map(t => t.id), 10), {title:'Mixed quiz', mode:'mixed'});
    case 'quizDaily': { const seedDay = new Date().getDate(); const ids = ALL.map(t => t.id); const ix = [0, 1, 2, 3, 4].map(i => ids[(seedDay * 3 + i * 5) % ids.length]);
      return startQuiz(ix.map(id => qItems([id], 1)[0]), {title:'Daily 5', mode:'mixed'}); }
    case 'quizSpeed': return startQuiz(qItems(ALL.map(t => t.id)), {title:'Speed round', mode:'speed'});
    case 'ans': return answerQuiz(+d.v);
    case 'next': return nextQuiz();
    case 'revise': return go('topic', {id:d.t, tab:'notes', sec:+d.r});
    case 'retry': { const q = Q; return startQuiz(q.mode === 'topic' ? qItems(q.ids) : q.mode === 'speed' ? qItems(ALL.map(t => t.id)) : qItems(ALL.map(t => t.id), 10), {title:q.title, mode:q.mode, tid:q.tid, ids:q.ids}); }
    /* slides */
    case 'slStart': return startSlides(d.id || P.id);
    case 'slNext': if (SL.i < SL.slides.length - 1) { SL.i++; SL.rev = 0; render(); window.scrollTo(0, 0); } return;
    case 'slPrev': if (SL.i > 0) { SL.i--; SL.rev = 0; render(); window.scrollTo(0, 0); } return;
    case 'slRev': SL.rev++; return render();
    case 'slDone': { const t = tp(d.id); if (!t.slides) { t.slides = 1; award(10); } return back(); }
    /* generator */
    case 'gen': { const id = d.id, q2 = GEN[id](); GQ[id] = {q2, res:null, score:(GQ[id] && GQ[id].score) || 0}; return render(); }
    case 'genCheck': { const g = GQ[d.id], el = $('#gans'), v = parseFloat(String(el.value).replace(',', '.')); if (isNaN(v)) { toast('Type a number first'); return; }
      g.given = v; g.res = checkNum(v, g.q2.ans); dayRec(); const dd = tp(d.id);
      if (g.res) { g.score++; dd.ws++; dayRec().w++; award(6, true); toast('+6 XP', 'xp'); } checkQuests(); save(); return render(); }
    /* exam questions */
    case 'exShow': { const s = EXS[d.k]; s.show = true; return render(); }
    case 'exTick': { const s = EXS[d.k]; s.ticks[+d.i] = !s.ticks[+d.i]; return render(); }
    case 'exSave': {
      const [id, qi] = d.k.split(':'), t = T(id), q = t.exam[+qi], s = EXS[d.k], dd = tp(id), sc = Math.min(q[1], s.ticks.filter(Boolean).length), prev = dd.ex[+qi] || 0;
      if (sc > prev) { dd.ex[+qi] = sc; award((sc - prev) * 3); } else toast(sc ? 'Saved. Your best is ' + prev + '/' + q[1] : 'Tick the points you earned first');
      save(); return render();
    }
    /* planner */
    case 'planDay': PLAN_DAY.k = d.k; return render();
    case 'prefToggle': PLAN_DAY.set = !PLAN_DAY.set; return render();
    case 'rebuild': buildPlan(); toast('Timetable rebuilt from your progress'); return render();
    case 'sess': case 'sessGo': { const s = S.plan.sessions.find(x => x.id === d.id); if (!s) return; return go('topic', {id:s.tid, tab:SESS_TYPES[s.type].tab}); }
    case 'sessDone': { const s = S.plan.sessions.find(x => x.id === d.id); if (!s) return; s.done = !s.done; S.done += s.done ? 1 : -1; if (s.done) award(15); else save(); return render(); }
    case 'mode': S.prefs.mode = d.m; save(); buildPlan(); return render();
    case 'ord': { const i = +d.i, j = i + (+d.d), o = S.prefs.order; if (j < 0 || j > 2) return; [o[i], o[j]] = [o[j], o[i]]; save(); buildPlan(); return render(); }
    case 'delFixed': S.prefs.fixed = S.prefs.fixed.filter(f => f.id !== d.id); save(); buildPlan(); return render();
    case 'nfday': { const b = document.querySelector(`#nfd [data-d="${d.d}"]`); b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); return; }
    case 'addFixed': {
      const name = $('#nfn').value.trim(), s = $('#nfs').value, e = $('#nfe').value, days = [...document.querySelectorAll('#nfd [aria-pressed="true"]')].map(b => +b.dataset.d);
      if (!name || !s || !e || toMin(e) <= toMin(s) || !days.length) { toast('Add a name, at least one day, and an end time after the start'); return; }
      S.prefs.fixed.push({id:'f' + Date.now(), name, days, s, e}); save(); buildPlan(); return render();
    }
    /* stats */
    case 'theme': { S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save(); return render(); }
    case 'resetAsk': P.reset = !P.reset; return render();
    default: return actExtra(a, d);
    case 'resetDo': { try { localStorage.removeItem(KEY); } catch (x) {} load(); S.plan = null; P = {}; applyTheme(); toast('Progress erased'); return render(); }
  }
}
function applyTheme() { if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }

document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && !b.disabled) act(b.dataset.a, b.dataset, b); });
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.name) { S.name = e.target.value; save(); } const lab = e.target.closest('[data-lab]'); if (lab) labUpdate(lab.dataset.lab); if (e.target.dataset.ex) { const k = e.target.dataset.ex; (EXS[k] = EXS[k] || {text:'', show:false, ticks:[]}).text = e.target.value; } });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.pref) {
    const k = el.dataset.pref;
    if (k === 'exam') S.exam = el.value;
    else if (el.type === 'number') { const v = parseInt(el.value, 10); if (isNaN(v)) return; S.prefs[k] = v; }
    else if (el.value) S.prefs[k] = el.value;
    if (k !== 'exam' && toMin(S.prefs.schoolEnd) <= toMin(S.prefs.schoolStart)) { toast('School must end after it starts'); render(); return; }
    save(); buildPlan(); render();
  } else if (el.dataset.paper) {
    const v = el.value === '' ? null : Math.max(0, Math.min(60, parseInt(el.value, 10)));
    if (v == null || isNaN(v)) delete S.papers[el.dataset.paper]; else S.papers[el.dataset.paper] = v;
    save(); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) { if (e.key === 'Enter' && e.target.id === 'gans') act('genCheck', {id:P.id}); return; }
  if (view === 'cards' && C) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); act('flip', {}); } else if (e.key === 'ArrowRight') act('got', {}); else if (e.key === 'ArrowLeft') act('nope', {}); }
  else if (view === 'slides' && SL) { if (e.key === 'ArrowRight') act('slNext', {}); else if (e.key === 'ArrowLeft') act('slPrev', {}); }
  else if (view === 'quiz' && Q) { const i = 'abcd'.indexOf(e.key.toLowerCase()); if (i > -1 && e.key.length === 1) act('ans', {v:i}); else if (e.key === 'Enter' && Q.sel != null && Q.mode !== 'speed') nextQuiz(); }
});
let tx = null;
document.addEventListener('touchstart', e => { if (view === 'slides') tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => { if (view !== 'slides' || tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (dx < -60) act('slNext', {}); else if (dx > 60) act('slPrev', {}); }, {passive:true});

/* ---------- Boot ---------- */
load(); applyTheme(); dayRec();
if (!S.plan || S.plan.built !== today()) buildPlan();
checkBadges(); save(); render();

</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script></body></html>
