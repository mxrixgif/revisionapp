<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Re-Vision</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#C4122F"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"></head><body>
<style>
/* Layout: mobile-first single column with bottom tab bar (iPhone and Android), side rail on wide screens. */
:root{
  --bg:#F2F3FA; --surface:#FFFFFF; --surface2:#F7F8FD; --ink:#16183A; --muted:#5F6488; --line:#E1E4F2;
  --accent:#C4122F; --accent-ink:#FFFFFF; --accent-soft:#FCE3E7; --vib:#0E8F6B;
  --gold:#E3A000; --gold-soft:#FFF1CC; --flame:#E4570F;
  --bio:#12935A; --chem:#E4570F; --phys:#2B63E8;
  --good:#12935A; --bad:#D93A4A; --good-soft:#DDF5E8; --bad-soft:#FFE2E5;
  --shadow:0 1px 2px rgba(22,24,58,.06),0 6px 20px rgba(22,24,58,.06);
  --font-display:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Roboto','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
  --on-c:#FFFFFF; --nav-h:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080A12; --surface:#111526; --surface2:#171C33; --ink:#EEF1FA; --muted:#98A2C3; --line:#252B4A;
  --on-c:#080A12; --accent:#FF5A70; --accent-ink:#1A0409; --accent-soft:#3A1220; --vib:#2FD6A1;
  --gold:#FFC83D; --gold-soft:#3A2D0C; --flame:#FF8650;
  --bio:#3DD088; --chem:#FF8A4C; --phys:#6E9BFF;
  --good:#3DD088; --bad:#FF6B7A; --good-soft:#12382A; --bad-soft:#44202A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080A12; --surface:#111526; --surface2:#171C33; --ink:#EEF1FA; --muted:#98A2C3; --line:#252B4A;
  --on-c:#080A12; --accent:#FF5A70; --accent-ink:#1A0409; --accent-soft:#3A1220; --vib:#2FD6A1;
  --gold:#FFC83D; --gold-soft:#3A2D0C; --flame:#FF8650;
  --bio:#3DD088; --chem:#FF8A4C; --phys:#6E9BFF;
  --good:#3DD088; --bad:#FF6B7A; --good-soft:#12382A; --bad-soft:#44202A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);background-image:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--accent) 16%,transparent),transparent),radial-gradient(700px 400px at -10% 100%,color-mix(in srgb,var(--vib) 12%,transparent),transparent);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;margin:0;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800;letter-spacing:.02em} h2{font-size:1.25rem;font-weight:800} h3{font-size:1.05rem;font-weight:700}
p{margin:0} b{font-weight:700}
a{color:var(--accent);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

#app{max-width:760px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#main{display:flex;flex-direction:column;gap:16px;min-width:0}
body.immersive #nav{display:none}
body.immersive #app{padding-bottom:32px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;background:none;border:0;border-radius:14px;color:var(--muted);font-size:.72rem;font-weight:700;cursor:pointer}
#nav button svg{width:24px;height:24px}
#nav button[aria-current="page"]{color:var(--accent)}
#nav button[aria-current="page"] svg{transform:translateY(-1px)}
@media (min-width:900px){
  #nav{top:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 8px;border-top:0;border-right:1px solid var(--line)}
  #app{margin-left:max(108px,calc(50vw - 380px + 46px));margin-right:auto;padding-bottom:48px}
  body.immersive #app{margin-left:auto}
}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* buttons: chunky, game-like */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);
  font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.primary:active{box-shadow:0 0 0 transparent}
.btn.good{background:var(--good);border-color:var(--good);color:var(--on-c);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 65%,#000)}
.btn svg{width:20px;height:20px;flex:none}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.9rem;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.xp{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.chip.fire{background:color-mix(in srgb,var(--flame) 14%,var(--surface));border-color:transparent;color:var(--flame)}
.chip svg{width:14px;height:14px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin-inline:-2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:42px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"],.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.c{--c:var(--accent)}
.pill.c[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-c)}

/* bars & rings */
.bar{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.xp>i{background:linear-gradient(90deg,var(--gold),var(--flame))}
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .rt{position:absolute;font-family:var(--font-display);font-weight:800;font-size:.8rem}

/* header */
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1;min-width:0}
.hero{background:linear-gradient(135deg,#7E0C22 0%,#C4122F 48%,#D8920A 100%);color:#fff;border:0;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,130,.75),rgba(255,200,61,.25) 45%,transparent 68%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.gem{width:22px;height:22px;flex:none;filter:drop-shadow(0 0 7px rgba(255,200,61,.8))}
h1{letter-spacing:.01em}
.card.hero .badge-lvl{box-shadow:0 0 0 3px rgba(255,200,61,.35)}
.hero .bar{background:rgba(255,255,255,.22);border-color:transparent}
.hero .bar>i{background:#fff}
.hero .muted{color:rgba(255,255,255,.8)}
.lvl{font-family:var(--font-display);font-weight:800;font-size:2.4rem;line-height:1}
.badge-lvl{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none;border:2px solid rgba(255,255,255,.4)}

/* topic rows */
.subj{--c:var(--accent)}
.subj.bio{--c:var(--bio)} .subj.chem{--c:var(--chem)} .subj.phys{--c:var(--phys)}
.trow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;min-height:68px}
.trow:active{background:var(--surface2)}
.tdot{width:6px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.steps{display:flex;gap:4px;margin-top:6px}
.steps i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.secthead{display:flex;align-items:center;gap:10px;margin-top:6px}
.secthead .sq{width:14px;height:14px;border-radius:5px;background:var(--c)}

/* topic */
.thead{background:var(--c);color:var(--on-c);border:0;border-radius:24px;padding:18px}
.thead .muted{color:inherit;opacity:.88}
.thead .bar{background:rgba(255,255,255,.25);border-color:transparent}.thead .bar>i{background:var(--on-c)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:42px;padding:8px 14px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--c);box-shadow:var(--shadow)}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:left;cursor:pointer;min-height:48px}
.task:last-child{border-bottom:0}
.tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on-c)}
.tick svg{width:16px;height:16px;opacity:0}
.task.done .tick{background:var(--good);border-color:var(--good)}.task.done .tick svg{opacity:1}
.task.done .tt{text-decoration:line-through;color:var(--muted)}

/* notes */
.nsec{scroll-margin-top:70px}
.nsec.flash{animation:flash 1.8s}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:var(--shadow)}}
.nsec h3{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nsec h3 .n{width:28px;height:28px;border-radius:9px;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-size:.85rem;flex:none}
.nsec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.nsec li{padding-left:18px;position:relative}
.nsec li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:3px;background:var(--c)}
.eq{background:var(--surface2);border:1px dashed var(--c);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.eq div{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:baseline}
.eq code{font-family:var(--font-mono);font-weight:700;font-size:.9rem;color:var(--c);overflow-wrap:anywhere}
.tip{background:var(--gold-soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.tip svg{width:20px;height:20px;flex:none;color:var(--gold);margin-top:2px}
.work{border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.work .q{font-weight:700}
.wstep{background:var(--surface2);border-radius:12px;padding:10px 12px;font-family:var(--font-mono);font-size:.88rem;display:flex;gap:10px;animation:rise .25s both;overflow-wrap:anywhere}
.wstep span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.72rem;font-weight:800}
.wans{background:var(--good-soft);color:var(--good);border-radius:12px;padding:10px 12px;font-weight:800;animation:rise .25s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* immersive sessions */
.sbar{display:flex;align-items:center;gap:12px}
.sbar .bar{flex:1}
.stage{display:flex;flex-direction:column;gap:16px;min-height:60vh}
.fc{perspective:1000px;min-height:260px;cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:center}
.fc .in{position:relative;min-height:260px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1.3}
.fc .back{transform:rotateY(180deg);background:var(--c);border-color:var(--c);color:var(--on-c);font-family:var(--font-body);font-weight:700;font-size:1.15rem}
.fc .face small{font-family:var(--font-body);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.qq{font-family:var(--font-display);font-weight:800;font-size:1.3rem;line-height:1.3}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);cursor:pointer;font-weight:600}
.opt .k{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:var(--good-soft);border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.expl{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:rise .25s both}
.expl.ok{background:var(--good-soft)}.expl.no{background:var(--bad-soft)}
.expl .wk{font-family:var(--font-mono);font-size:.88rem;background:var(--surface);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.combo{font-family:var(--font-display);font-weight:800;color:var(--flame)}
.feedback{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}

/* slides */
.slide{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:24px;padding:22px;min-height:52vh;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);touch-action:pan-y}
.slide h2{font-size:1.5rem}
.slide .kicker{color:var(--c)}
.slide ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:1.05rem}
.slide li{padding-left:22px;position:relative;animation:rise .35s both}
.slide li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:4px;background:var(--c)}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c);transform:scale(1.25)}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mt{min-height:72px;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:.85rem;cursor:pointer;display:grid;place-items:center;text-align:center;overflow-wrap:anywhere}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.gone{visibility:hidden}
.mt.bad{animation:shake .35s;border-color:var(--bad)}

/* labs */
.lab svg{max-width:100%;height:auto}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.slider{display:flex;flex-direction:column;gap:2px}
.slider .row{justify-content:space-between}
.readout{font-family:var(--font-mono);background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:.9rem;overflow-wrap:anywhere}
.field{width:100%;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:8px 12px}
.field:focus{border-color:var(--accent);outline:none}

/* planner */
.tl{position:relative;border-left:2px solid var(--line);margin-left:44px;min-width:0}
.tl .hr{position:absolute;left:-44px;width:38px;text-align:right;font-size:.7rem;color:var(--muted);transform:translateY(-.6em);font-weight:700}
.tl .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.blk{position:absolute;left:8px;right:0;border-radius:12px;padding:3px 10px;overflow:hidden;font-size:.8rem;line-height:1.25;background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.blk b{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.school{background:repeating-linear-gradient(135deg,var(--surface2),var(--surface2) 8px,var(--bg) 8px,var(--bg) 16px);color:var(--muted)}
.blk.act{background:color-mix(in srgb,var(--flame) 14%,var(--surface));border-color:color-mix(in srgb,var(--flame) 40%,var(--line))}
.blk.study{background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px solid var(--c);cursor:pointer;text-align:left}
.blk.study.done{opacity:.6}
.blk.study.done b{text-decoration:line-through}
.blk.now{border-color:var(--accent)}
.nowline{position:absolute;left:-6px;right:0;border-top:2px solid var(--bad);z-index:2}
.nowline::before{content:"";position:absolute;left:-2px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.days{display:flex;gap:6px}
.day{flex:1;min-width:0;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.8rem}
.day small{font-size:1rem;font-family:var(--font-display)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day .pip{height:4px;margin-top:2px;display:flex;gap:2px}.day .pip i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}

/* stats */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface2);border:1px solid var(--line);min-width:0}
.heat i.l1{background:color-mix(in srgb,var(--accent) 25%,var(--surface2))}.heat i.l2{background:color-mix(in srgb,var(--accent) 50%,var(--surface2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 75%,var(--surface2))}.heat i.l4{background:var(--accent)}
.wkb{display:flex;align-items:flex-end;gap:8px;height:90px}
.wkb div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:.7rem;color:var(--muted);font-weight:700}
.wkb i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px}
.grade{font-family:var(--font-display);font-weight:800;line-height:1}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:.75rem;font-weight:700}
.badge .bi{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.badge .bi svg{width:26px;height:26px}
.badge.locked{opacity:.45;filter:grayscale(1)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cd{aspect-ratio:1;min-height:40px;border-radius:12px;border:2px solid transparent;background:var(--surface2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.85rem;padding:0}
.cd i{width:6px;height:6px;border-radius:50%;background:transparent}
.cd i.full{background:var(--good)} .cd i.part{background:var(--gold)} .cd i.plan{background:var(--muted);opacity:.6}
.cd.tdy{border-color:var(--accent)} .cd.sel{background:var(--accent);color:var(--accent-ink)}
.cd.sel i.plan{background:var(--accent-ink)}
.lg{display:inline-block;width:8px;height:8px;border-radius:50%}.lg.full{background:var(--good)}.lg.part{background:var(--gold)}.lg.plan{background:var(--muted)}

/* overlays */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);animation:rise .25s both}
.toast.xp{background:var(--gold);color:#241800}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,30,.7);display:grid;place-items:center;padding:20px;animation:fade .2s both}
.modal .box{background:var(--surface);border-radius:28px;padding:28px 22px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.cf{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;z-index:70;animation:fall 1.6s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
svg{display:block}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

   '**Health** is a state of complete physical, mental and social well-being, not merely the absence of disease (World Health Organization definition).',

  ['Pathogens and infections',[
   'A **pathogen** is a disease-causing organism: **viruses, bacteria, fungi, protists**.',
   '**Cholera** (bacteria): diarrhoea, spread by water. **Tuberculosis** (bacteria): lung damage, airborne. **Chalara ash dieback** (fungus): leaf loss and bark lesions, airborne. **Malaria** (protist): damage to blood and liver, spread by an animal vector (mosquito). **HIV** (virus): destroys white blood cells, leading to AIDS.',

   'Spread can be reduced by clean water, hygiene, isolation, controlling vectors and vaccination.']],

   '**Physical barriers**: skin, and mucus and cilia in the airways.',
   '**Chemical defences**: lysozyme enzymes (in tears and saliva) and hydrochloric acid in the stomach.',
   '**Specific immune system**: pathogens carry **antigens**. These trigger white blood cells (lymphocytes) to make **antibodies**. Memory lymphocytes remain, so a second exposure gives a faster, larger **secondary response**.']],
  ['Immunisation and antibiotics',[

  ['Developing new medicines',[
   'The process has many stages: **discovery, development, preclinical testing** (cells, tissues, animals) and **clinical testing** (volunteers and patients) to check safety, dose and effectiveness.']],
  ['Non-communicable disease and lifestyle',[
   'Many non-communicable diseases are caused by **a number of interacting factors**: cardiovascular diseases, many cancers, some lung and liver diseases, and diseases influenced by nutrition.',

  ['Treating cardiovascular disease',[

   'Oxygen diffuses from the air into the blood. Carbon dioxide diffuses from the blood into the air.']],

   '**Red blood cells**: carry oxygen (haemoglobin), biconcave shape for surface area, no nucleus.',

   '**Plasma**: carries cells, dissolved nutrients, hormones, carbon dioxide and urea. **Platelets**: help blood to clot.',

   'A **scalar** has magnitude (size) only. A **vector** has magnitude and direction.',

   '**Velocity** is speed in a stated direction.',
   'Typical speeds: walking 1.5 m/s, running 3 m/s, cycling 6 m/s, car 25 m/s, sound 330 m/s, wind 5 to 20 m/s.']],
  ['Speed and acceleration',[
   '**Speed = distance ÷ time**, so distance = speed × time.',
   '**Acceleration = change in velocity ÷ time taken**. Slowing down is negative acceleration.',
   'In free fall near Earth\'s surface, acceleration due to gravity **g = 10 m/s²** (= 10 N/kg).',
   'Laboratory methods for speed: light gates and timers, or a ruler and stopwatch over a measured distance.']],
  ['Motion graphs',[
   '**Distance–time graph**: gradient = speed. Flat line = stationary. Steeper = faster. A curve means changing speed.',
   '**Velocity–time graph**: gradient = acceleration (for uniform acceleration). **Area under the graph** = distance travelled. Flat line = constant velocity.',
   'Compare accelerations qualitatively from the steepness of the gradients.']],
  ['Newton\'s laws and weight',[
   '**First law**: an object stays at rest or moves at constant velocity unless a **resultant force** acts. If the resultant force is not zero, the speed and/or direction changes.',
   '**Second law**: **F = ma**. A bigger force or smaller mass gives more acceleration.',
   '**Third law**: when two objects interact, the forces are **equal and opposite** and act on different objects (for example in equilibrium).',
   '**Weight (N) = mass (kg) × gravitational field strength (N/kg)**, W = mg, with g = 10 N/kg on Earth.']],
  ['Stopping distance and reaction time',[
   '**Stopping distance = thinking distance + braking distance**.',
   'Thinking distance rises with **speed** and with **slower reaction time**. Reaction time is affected by **drugs**, **alcohol**, tiredness and **distractions**. Measure reaction time by catching a falling ruler.',
   'Braking distance rises with **speed**, the **mass** of the vehicle, **worn brakes or tyres**, and **wet or icy roads** (less friction between tyre and road).',
   'Large decelerations are dangerous because they need large forces.']],
  ['Units and conversions',[
   'Use SI units: metre (m), kilogram (kg), second (s), newton (N), joule (J), watt (W), hertz (Hz), volt (V), ampere (A), ohm (Ω).',
   'Multiples: giga (G) = 10⁹, mega (M) = 10⁶, kilo (k) = 10³, centi (c) = 10⁻², milli (m) = 10⁻³, micro (µ) = 10⁻⁶, nano (n) = 10⁻⁹.',
   'Convert units before calculating, for example hours to seconds (× 3600), km/h to m/s (÷ 3.6), cm to m (÷ 100).',
   'Give answers to a sensible number of **significant figures**, and use **standard form** for very large or small numbers, for example 3 × 10⁸ m/s.']]

{
 id:'p2', paper:[5], spec:'Physics Topic 3', title:'Conservation of energy', blurb:'Energy stores, GPE and KE, dissipation, efficiency and energy resources.',
 notes:[
  ['Energy stores and transfers',[
   'Stores include **kinetic, gravitational potential, elastic, thermal, chemical and nuclear**.',
   'Examples to analyse: an object thrown upwards (kinetic → gravitational potential), a moving object hitting an obstacle, an object accelerated by a constant force, a vehicle slowing down (kinetic → thermal), and bringing water to the boil in a kettle (electrical → thermal).',
   'Draw and interpret **Sankey and energy transfer diagrams**.']],
  ['Conservation and dissipation',[
   '**Conservation of energy**: energy cannot be created or destroyed, only transferred. In a **closed system** there is no net change to the total energy.',
   'Mechanical processes become **wasteful** when they cause a rise in temperature, because energy is **dissipated** to the surroundings as heat (stored in a less useful way).',
   'Reduce unwanted transfers with **lubrication** and **thermal insulation**. A thicker wall, or a wall with a **lower thermal conductivity**, slows the rate of cooling of a building.']],
  ['Kinetic and gravitational potential energy',[
   '**Kinetic energy = ½ × mass × speed²**. Doubling the speed makes the kinetic energy four times bigger.',
   '**Change in gravitational potential energy = mass × gravitational field strength × change in height** (g = 10 N/kg).',
   'A falling object converts GPE into KE (ignoring air resistance).']],
  ['Efficiency',[
   '**Efficiency = useful energy output ÷ total energy input** (×100 for a percentage). It is always less than 1 (100%).',
   'Efficiency can be increased by reducing wasted energy, for example with insulation, lubrication or better design.']],
  ['Energy resources',[
   '**Non-renewable**: fossil fuels (coal, oil, gas) and nuclear fuel. They will run out. Fossil fuels release carbon dioxide.',
   '**Renewable**: biofuel, wind, hydroelectricity, tides and the Sun (solar). They will not run out but can be unreliable or costly to set up.',
   'Explain patterns and trends in the use of energy resources, for example the shift from coal towards gas and renewables.']]
 ],

{

 notes:[
  ['Wave basics',[
   'Waves transfer **energy and information without transferring matter**. With water and sound waves, it is the wave that travels, not the water or air itself.',
   '**Frequency** (Hz): waves per second. **Wavelength**: distance between matching points. **Amplitude**: maximum displacement from rest. **Period**: time for one wave (1 ÷ frequency). **Wave velocity**: speed of the wave. **Wavefront**: a line joining points in the same part of the wave.']],
  ['Transverse and longitudinal',[
   '**Transverse** waves: oscillations at right angles to the direction of energy transfer. Examples: electromagnetic waves, water ripples and **S seismic waves**.',
   '**Longitudinal** waves: oscillations parallel to the direction of energy transfer, with compressions and rarefactions. Examples: **sound** and **P seismic waves**.']],
  ['Wave equations',[
   '**Wave speed = frequency × wavelength** (v = fλ).',
   '**Wave speed = distance ÷ time** (v = x ÷ t).',
   'Speed of sound in air is about 330 m/s. Light and all EM waves travel at about 3 × 10⁸ m/s in a vacuum.',
   'Different substances may **absorb, transmit, refract or reflect** waves in ways that vary with wavelength.']],
  ['Practical: measuring waves',[
   'Core practical: investigate the suitability of equipment to measure the speed, frequency and wavelength of a wave in a solid and a fluid. For example, a ripple tank with a stroboscope or camera for water, and a vibrating string or a slinky for solids.',
   'To reduce error, measure several wavelengths together and divide.']]
 ],

{
 id:'p11', paper:[5], spec:'Physics Topic 5', title:'Light and the electromagnetic spectrum', blurb:'The EM spectrum, uses, dangers and refraction.',
 notes:[
  ['The EM spectrum',[
   'All electromagnetic waves are **transverse**, travel at the **same speed in a vacuum**, and transfer energy from source to observer.',
   'In order of **increasing frequency** (decreasing wavelength): **radio waves, microwaves, infrared, visible light, ultraviolet, X-rays, gamma rays**.',
   'The spectrum is continuous. Our eyes detect only a limited range of frequencies (visible light: red to violet).',
   'Mnemonic: **R**aging **M**artians **I**nvaded **V**enus **U**sing **X**-ray **G**uns.']],
  ['Uses',[
   '**Radio waves**: broadcasting, communications, satellite transmissions.',
   '**Microwaves**: cooking, communications, satellite transmissions.',
   '**Infrared**: cooking, thermal imaging, short range communications, optical fibres, TV remote controls, security systems.',
   '**Visible light**: vision, photography, illumination.',
   '**Ultraviolet**: security marking, fluorescent lamps, detecting forged bank notes, disinfecting water.',
   '**X-rays**: observing the internal structure of objects, airport security scanners, medical X-rays.',
   '**Gamma rays**: sterilising food and medical equipment, detecting and treating cancer.']],
  ['Dangers',[
   'The potential danger of an EM wave **increases with frequency**.',
   '**Microwaves**: internal heating of body cells. **Infrared**: skin burns. **Ultraviolet**: damage to surface cells and eyes, leading to skin cancer and eye conditions. **X-rays and gamma rays**: mutation or damage to cells in the body.']],
  ['Refraction and atoms',[
   '**Refraction** happens when waves enter another material and change speed and direction. Light slows down and bends towards the normal going from air into glass.',
   'Core practical: investigate refraction in rectangular glass blocks by tracing rays and measuring angles of incidence and refraction.',
   'Changes in atoms and nuclei can **generate** radiations over a wide frequency range, and absorption of a range of radiations can cause such changes.']]
 ],

  ['Danger of ultraviolet?','Damage to surface cells and eyes; skin cancer.'],
  ['Danger of X-rays and gamma rays?','Mutation or damage to cells.'],

{
 id:'p5', paper:[5], spec:'Physics Topic 6', title:'Radioactivity', blurb:'Atomic models, ionising radiation, nuclear equations, half-life and safety.',
 notes:[
  ['Atoms and how the model changed',[
   'An atom has a positively charged **nucleus** (protons and neutrons) with electrons orbiting at set distances. The nucleus is much smaller than the atom but holds almost all the mass.',
   'The **plum pudding** model was replaced after **Rutherford\'s alpha particle scattering** experiment, which led to the nuclear model and then the **Bohr model**.',
   'Isotope notation, for example ¹³₆C: mass number (top) and atomic number (bottom). Isotopes have the same number of protons but different numbers of neutrons.',
   'Electrons change orbit when they absorb or emit electromagnetic radiation. Atoms form positive ions by losing outer electrons.']],
  ['Radioactive decay and detection',[
   '**Unstable nuclei** emit alpha, beta, gamma radiation (and neutrons) in a **random** process. These are **ionising** radiations.',
   '**Background radiation** comes from rocks and the Earth (for example radon gas) and from space (cosmic rays), plus food and medical sources.',
   'Detect with **photographic film** or a **Geiger–Müller tube**. Activity is measured in **becquerels (Bq)**.']],
  ['Alpha, beta and gamma',[
   '**Alpha (α)**: a helium nucleus (2 protons + 2 neutrons). Stopped by paper. **Strongly ionising**. Short range in air.',
   '**Beta (β)**: a fast electron from the nucleus. Stopped by a few mm of aluminium. **Moderately ionising**.',
   '**Gamma (γ)**: electromagnetic radiation. Reduced by thick lead or concrete. **Weakly ionising**, very penetrating.',
   'After alpha or beta decay a nucleus often loses extra energy as gamma radiation.']],
  ['Nuclear equations',[
   '**Alpha decay**: the atomic number falls by 2 and the mass number falls by 4.',
   '**Beta decay**: a neutron becomes a proton plus an electron, so the atomic number rises by 1 and the mass number is unchanged.',
   '**Beta-plus (positron) decay**: a proton becomes a neutron and a positron is emitted, so the atomic number falls by 1 and the mass number is unchanged.',
   'In a balanced nuclear equation the total mass numbers and the total charges (atomic numbers) are equal on both sides.']],
  ['Half-life',[
   '**Half-life** is the time taken for the activity of a source to halve, or for half the undecayed nuclei to decay.',
   'You cannot predict when a particular nucleus will decay, but half-life lets us predict the behaviour of a very large number of nuclei.',
   'Use half-life for simple calculations and from graphs.']],
  ['Safety',[
   '**Irradiation**: exposure to radiation from outside. **Contamination**: radioactive atoms get on or in the body. Contamination is usually more hazardous because the source stays on or in the body.',
   'Dangers: ionising radiation damages tissue and can cause mutations, leading to cancer.',
   'Precautions: limit time and the dose (for patients), keep distance, shield, and protect medical staff.']]
 ],

{
 id:'p9', paper:[6], spec:'Physics Topics 9 and 15', title:'Forces, springs and matter', blurb:'Contact and non-contact forces, vectors, elastic distortion and F = kx.',
 notes:[
  ['Forces and interactions',[
   'Objects interact **at a distance without contact** (gravitational, electrostatic and magnetic fields) or **by contact** (normal contact force and friction).',
   'Forces come in **pairs** and are vectors: each has a size and a direction.',
   'Lubrication reduces unwanted energy transfer by reducing friction.']],
  ['Vectors and scalars',[
   'A **vector** has size and direction (for example force, velocity). A **scalar** has size only (for example speed, mass, energy).']],
  ['Springs and elastic distortion',[
   'Stretching, bending or compressing an object needs **more than one force**.',

  ['Heating effect',[

s(T_EVO,"Describe how an early stone tool was made.","By hitting the stone with another hard stone (or rock) to knock off flakes.","June 2022 · Biology 1 · Q2(a)(i)"),

/* ===== DISEASE, DEFENCE & MEDICINES ===== */
m(T_DIS,"Which word describes an organism that causes disease?",["Pathogen","Culture","Antibiotic","Platelet"],0,"A pathogen causes disease.","June 2022 · Biology 1 · Q1(a)"),
m(T_DIS,"Malaria is caused by which type of pathogen and spread by what?",["A bacterium, in water","A virus, in the air","A protist, by a mosquito vector","A fungus, by contact"],2,"Malaria is caused by a protist and spread by vectors (mosquitoes).","June 2024 · Biology 1 · Q6(a)"),
m(T_DIS,"Chlamydia is caused by which type of pathogen and spread how?",["A bacterium, by sexual contact","A virus, by sneezing","A protist, by insect bite","A fungus, by food"],0,"Chlamydia is caused by a bacterium and spread by sexual contact.","June 2019 · Biology 1 · Q2(a)"),
m(T_DIS,"Which type of cell does HIV destroy?",["Red blood cell","Nerve cell","White blood cell","Sperm cell"],2,"HIV destroys white blood cells, weakening the immune system.","June 2020 · Biology 1 · Q5(b)"),
s(T_DIS,"Why are antibiotics not used to treat the common cold?","The cold is caused by a virus, and antibiotics only kill bacteria.","June 2024 · Biology 1 · Q4(a)(i)"),
s(T_DIS,"Explain why chlamydia can be treated with antibiotics.","Chlamydia is caused by bacteria, and antibiotics kill bacteria or stop them reproducing.","June 2022 · Biology 1 · Q6(a)(v)"),
m(T_DIS,"What is the last stage in the development of a new antibiotic?",["Discovery","Preclinical testing","Clinical testing","Diagnosis"],2,"Order: discovery, preclinical testing, then clinical testing.","June 2024 · Biology 1 · Q4(a)(ii)"),
s(T_DIS,"Patient X has 8 500 white blood cells per µl, Y has 5 700 and Z has 12 500. Why does this suggest Z has a bacterial infection?","Z has the highest white blood cell count, and white blood cells kill pathogens and make antibodies.","June 2018 · Biology 1 · Q1(c)"),
s(T_DIS,"Give two safety precautions when handling blood samples.","Any two: wear gloves and goggles; clean up spills; store samples in sealed containers; dispose of samples safely.","June 2018 · Biology 1 · Q1(d)"),
s(T_DIS,"Describe how physical barriers and chemical defences protect the body from disease.","Physical: skin is a barrier; mucus traps pathogens; cilia move them out. Chemical: stomach acid kills pathogens; lysozyme in tears and saliva kills bacteria.","June 2021 · Biology 1 · Q6(c)"),
s(T_DIS,"Explain how the immune system responds to a bacterial infection.","Phagocytes engulf pathogens; white blood cell numbers increase; lymphocytes make specific antibodies that bind to the antigens; memory lymphocytes remain, so a second infection is dealt with faster.","June 2022 · Biology 1 · Q6(b)"),
s(T_DIS,"Describe how the specific immune system defends the body.","Pathogens have antigens; these trigger lymphocytes to make antibodies, which destroy the pathogen; memory cells are made, giving a faster response if infected again.","June 2020 · Biology 1 · Q5(c)"),
s(T_DIS,"Children are vaccinated against tetanus. Explain why they do not get ill if the bacteria enter a cut.","The vaccine contains antigens (inactive bacteria), so lymphocytes make antibodies and memory cells. If the real bacteria enter, a faster, larger response happens before the disease develops.","June 2019 · Biology 1 · Q6(a)"),
s(T_DIS,"Measles cases fell greatly between 1985 and 2015. Explain one conclusion.","Vaccination has been effective, so more people are immune and the disease spreads less.","June 2024 · Biology 1 · Q6(b)"),
s(T_DIS,"State two differences between communicable and non-communicable diseases.","Communicable diseases are caused by pathogens and can be passed from person to person. Non-communicable diseases are not caused by pathogens and cannot be passed on.","June 2021 · Biology 1 · Q6(b)(i)"),
s(T_DIS,"Give two ways to reduce the spread of tuberculosis.","Any two: antibiotics; vaccination; covering the mouth or wearing a mask; isolating infected people; handwashing.","June 2025 · Biology 1 · Q5(a)(iii)"),
s(T_DIS,"Give one way the transmission of chlamydia can be prevented.","Any one: avoid sexual contact; use a condom; screening; treatment with antibiotics.","June 2022 · Biology 1 · Q6(a)(iv)"),
s(T_DIS,"Name the organisation that defines health as complete physical, mental and social well-being.","The World Health Organization (WHO).","June 2021 · Biology 1 · Q6(a)"),
s(T_DIS,"Explain why measles is described as communicable.","It can be passed from person to person.","June 2020 · Biology 1 · Q5(a)(ii)"),
s(T_DIS,"Name two types of white blood cell.","Phagocytes and lymphocytes.","June 2024 · Biology 2 · Q5(b)(iii)"),
s(T_DIS,"Describe two ways white blood cells defend the body.","Any two: make antibodies; surround, engulf and digest pathogens; remember pathogens (memory cells) for a faster response.","June 2021 · Biology 2 · Q1(a)(iii)"),
s(T_DIS,"Describe how the ciliated cells and mucus in the airways protect the body.","Pathogens stick in the mucus; the cilia waft the mucus and pathogens up to the throat to be swallowed.","June 2025 · Biology 2 · Q5(b)"),

/* ===== LIFESTYLE & NON-COMMUNICABLE DISEASE ===== */
s(T_LIFE,"Name two lifestyle factors, other than smoking, that can cause disease.","Any two: alcohol; drugs; poor diet or overeating; lack of exercise.","June 2024 · Biology 1 · Q1(c)"),
m(T_LIFE,"Prolonged alcohol abuse causes cirrhosis of which organ?",["Brain","Liver","Heart","Skin"],1,"Cirrhosis is scarring of the liver.","June 2018 · Biology 1 · Q5(a)(i)"),
s(T_LIFE,"Explain why cirrhosis (or beriberi) is non-communicable.","It is not caused by a pathogen and cannot be passed from person to person.","June 2018 · Biology 1 · Q5(a)(ii)"),
s(T_LIFE,"Explain why exercise can lead to weight loss.","Exercise uses energy from respiration, which is obtained by using up stored fat.","June 2018 · Biology 1 · Q5(b)"),
s(T_LIFE,"Explain how a gastric band helps a person lose weight.","It makes the stomach smaller, so the person eats less food and stored fat is used up.","June 2018 · Biology 1 · Q5(c)"),
s(T_LIFE,"A person has a BMI of 39. Explain their risk of cardiovascular disease.","The BMI is in the obese range, so the risk is high.","June 2023 · Biology 1 · Q3(b)(i)"),
s(T_LIFE,"State two treatments for cardiovascular disease other than lifestyle changes.","Any two: medication; stents; bypass surgery; heart transplant.","June 2023 · Biology 1 · Q3(b)(ii)"),
m(T_LIFE,"Which is the description of cancer?",["Uncontrolled organ division","Uncontrolled cell division","Controlled cell division","Controlled organ division"],1,"Cancer is uncontrolled cell division.","June 2023 · Biology 1 · Q3(c)(iv)"),
s(T_LIFE,"Give two reasons why the percentage of people who smoke fell between 2011 and 2019.","Any two: more people aware of the health risks; fewer people starting; alternatives such as patches or vapes; cigarettes are expensive.","June 2023 · Biology 1 · Q3(c)(ii)"),
s(T_LIFE,"The risk of cirrhosis rises with weekly alcohol units and is lower for drinking with meals. Give two pieces of health advice.","Drink less alcohol; if drinking, drink with meals rather than on its own.","June 2022 · Biology 1 · Q3(b)(ii)"),
s(T_LIFE,"A man has a BMI of 27.3 and a waist:hip ratio of 0.85. Abdominal obesity is above 0.90. What does this show?","He is overweight, but his ratio is below 0.90, so he is not abdominally obese: his weight is not concentrated around the abdomen.","June 2018 · Biology 1 · Q5(d)(ii)"),
s(T_LIFE,"Calculate the waist-to-hip ratio for a person with an 85 cm waist and a 100 cm hip.","85 ÷ 100 = 0.85.","June 2025 · Biology 1 · Q5(b)(ii)"),
s(T_LIFE,"A female has a waist-to-hip ratio of 0.75, which is below 0.80. What does this suggest about her health risk?","Her risk is low, because the excess mass is not stored around the waist or vital organs.","June 2025 · Biology 1 · Q5(b)(iii)"),
s(T_LIFE,"Some athletes have a high BMI but a low waist-to-hip ratio. Explain why this can be healthy.","Their high BMI is due to a high percentage of muscle rather than fat.","June 2021 · Biology 2 · Q3(d)(ii)"),
s(T_LIFE,"Give two factors that affect a person's risk of type 2 diabetes.","Any two: age; diet; exercise; ethnicity; genetics; weight.","June 2021 · Biology 2 · Q3(d)(i)"),

/* ===== NERVOUS SYSTEM ===== */
s(T_NERV,"Describe the path of an impulse through a reflex arc from the skin to a muscle.","Receptor in the skin, sensory neurone, relay neurone in the spinal cord, motor neurone, effector (muscle), which contracts.","June 2024 · Biology 1 · Q6(d)(ii)"),
s(T_NERV,"Explain the function of a reflex arc.","It produces a fast, automatic response to protect the body from harm, bypassing the brain.","June 2021 · Biology 1 · Q5(b)(ii)"),
s(T_NERV,"Describe how an impulse passes from a relay neurone to a motor neurone.","A neurotransmitter is released, diffuses across the synapse, binds to receptors on the next neurone, and triggers a new impulse.","June 2021 · Biology 1 · Q5(b)(i)"),
s(T_NERV,"State the role of a motor neurone in a reflex arc.","It carries electrical impulses from the central nervous system to an effector.","June 2025 · Biology 1 · Q4(b)(i)"),
s(T_NERV,"Explain the function of the myelin sheath.","It insulates the axon, so impulses travel faster.","June 2025 · Biology 1 · Q4(b)(ii)"),
s(T_NERV,"Name the two structures on a motor neurone: the fatty layer around the axon, and the long fibre that carries the impulse.","Myelin sheath (fatty layer) and axon (long fibre).","June 2021 · Biology 1 · Q5(a)(ii)"),
m(T_NERV,"In a ruler-drop test, which measurement shows reaction time?",["Time for the ruler to fall","Distance the ruler falls","Distance between the hands","Room temperature"],1,"The further the ruler falls before being caught, the slower the reaction time.","June 2025 · Biology 1 · Q4(a)(i)"),
s(T_NERV,"Five students in a ruler-drop test have results of 16, 12, 14, 13 and 15 cm. Calculate the mean.","(16 + 12 + 14 + 13 + 15) ÷ 5 = 14.0 cm.","June 2025 · Biology 1 · Q4(a)(ii)"),
s(T_NERV,"In a ruler-drop investigation, give two variables to control.","Any two: same ruler; same drop height or finger/hand distance; same hand; no stimulants or drugs; same environment.","June 2025 · Biology 1 · Q4(a)(iv)"),
m(T_NERV,"Five students have reaction times of 190, 205, 220, 230 and 250 ms. What is the median?",["205 ms","220 ms","219 ms","230 ms"],1,"The median is the middle value when the results are in order: 220 ms.","June 2021 · Biology 1 · Q5(c)(i)"),
s(T_NERV,"Describe how to compare reaction times to red squares turning yellow with blue squares turning yellow.","Use the same students and program; change only the colour pair; repeat several times; calculate a mean for each; compare. Control other variables such as tiredness or environment.","June 2021 · Biology 1 · Q5(c)(ii)"),

/* ===== PHOTOSYNTHESIS & PLANT TRANSPORT ===== */
m(T_PHOT,"Which are the two products of photosynthesis?",["Carbon dioxide and water","Glucose and oxygen","Glucose and carbon dioxide","Oxygen and water"],1,"Water + carbon dioxide → glucose + oxygen.","June 2022 · Biology 2 · Q4(a)(i)"),
s(T_PHOT,"Write the word equation for photosynthesis.","Water + carbon dioxide → glucose + oxygen (in the presence of light).","June 2025 · Biology 2 · Q2(a)"),
s(T_PHOT,"Name the green chemical in chloroplasts that absorbs light.","Chlorophyll.","June 2024 · Biology 2 · Q2(b)"),
s(T_PHOT,"Why do root cells not have chloroplasts?","Roots are underground where there is no light, so they cannot photosynthesise.","June 2024 · Biology 2 · Q6(a)(iii)"),
s(T_PHOT,"Describe how to test whether potted plants grow faster with more light.","Any three: vary the light level; leave for a set time (at least a day); water the plants; measure height or mass or count leaves. Keep other variables the same.","June 2024 · Biology 2 · Q2(c)(i)"),
s(T_PHOT,"Explain the effect of a temperature of 60 °C on photosynthesis.","Photosynthesis stops because the enzymes are denatured.","June 2024 · Biology 2 · Q2(c)(iii)"),
s(T_PHOT,"In a pondweed investigation, what is the effect of higher light intensity on the number of bubbles?","As light intensity increases, the rate of photosynthesis increases, so more bubbles are produced per minute.","June 2022 · Biology 2 · Q4(a)(ii)"),
s(T_PHOT,"How could you change the water temperature in a pondweed investigation?","Use a water bath at different temperatures and check each with a thermometer.","June 2022 · Biology 2 · Q4(a)(iv)"),
s(T_PHOT,"Plan an investigation into the effect of light intensity on the rate of photosynthesis in pondweed.","Place a lamp at a set distance; count bubbles (or measure the volume of oxygen) over a set time; repeat at other distances. Control ambient light, water temperature (heat shield and thermometer), carbon dioxide (sodium hydrogencarbonate), the pondweed used, and give it time to acclimatise.","June 2020 · Biology 2 · Q6(c)"),
m(T_PHOT,"Which carbohydrate is transported in the phloem?",["Starch","Glucose","Sucrose","Cellulose"],2,"Sucrose is transported in phloem.","June 2025 · Biology 2 · Q2(b)(ii)"),
s(T_PHOT,"Describe how sucrose is transported in a plant.","In the phloem, dissolved in water, by translocation (which involves active transport).","June 2020 · Biology 2 · Q5(b)(iii)"),
s(T_PHOT,"Give two ways a root hair cell is adapted to absorb water and mineral ions.","Any two: large surface area (long, thin extension); thin wall; many mitochondria for energy for active transport.","June 2024 · Biology 2 · Q6(a)(ii)"),
s(T_PHOT,"Describe two features of xylem vessels.","Thick walls (lignin) and continuous hollow tubes with no end walls (dead cells).","June 2022 · Biology 2 · Q5(b)(ii)"),
s(T_PHOT,"Explain why a fan blowing across a leafy shoot increases water uptake.","The fan removes water vapour from around the leaf, so more water evaporates (transpiration), and the plant takes up more water.","June 2022 · Biology 2 · Q5(c)(i)"),
s(T_PHOT,"In a water uptake investigation, the volume falls from 70 mm³ to 50 mm³ in 4 minutes. Calculate the rate of water uptake.","(70 − 50) ÷ 4 = 5 mm³ per minute.","June 2022 · Biology 2 · Q5(c)(iii)"),
s(T_PHOT,"Explain how water moves from the soil, through a plant, and into the air.","Water enters root hair cells by osmosis (from a dilute to a more concentrated solution), moves up the xylem driven by transpiration, and is lost from the leaves through stomata by evaporation and diffusion.","June 2024 · Biology 2 · Q6(c)"),
s(T_PHOT,"Explain how water and sucrose move through a plant using xylem and phloem.","Xylem: dead, hollow, lignified tubes carry water and mineral ions from roots to leaves (transpiration stream). Phloem: living sieve tubes carry sucrose from the leaves to roots and growing parts by translocation, using active transport.","June 2018 · Biology 2 · Q6(c)"),
s(T_PHOT,"Describe how guard cells open a stoma.","Guard cells take in water by osmosis, become turgid, and change shape so the stoma opens.","June 2018 · Biology 2 · Q6(b)(ii)"),
s(T_PHOT,"Why is a leaf peel used to look at stomata under a light microscope?","A leaf is too thick. A peel is thin, so light passes through and the stomata and guard cells can be seen.","June 2018 · Biology 2 · Q6(a)(ii)"),
s(T_PHOT,"A water lily leaf floats with its lower surface in water. Explain why this is a problem for gas exchange.","The lower surface is not in contact with air, so gases cannot be exchanged through the stomata there.","June 2020 · Biology 2 · Q5(a)"),
s(T_PHOT,"Describe how mineral ions move from the soil into a plant.","Dissolved in water, they diffuse (or are actively transported) into the root and move up the xylem in the transpiration stream.","June 2021 · Biology 2 · Q5(c)"),
s(T_PHOT,"Plants on a woodland floor: how does light intensity affect the number of small plants per m²?","As light intensity decreases, the number of small plants decreases, because they cannot photosynthesise enough.","June 2021 · Biology 2 · Q5(d)(i)"),
m(T_PHOT,"What is the effect of a shortage of nitrate ions on plants?",["Faster growth and darker leaves","Reduced growth and lighter green leaves","No effect","Larger roots only"],1,"Nitrate is needed to make proteins, so growth is reduced and leaves are pale.","June 2018 · Biology 2 · Q3(a)(i)"),

/* ===== BLOOD, HEART & CIRCULATION ===== */
s(T_BLOOD,"Why do arteries have thicker, more muscular walls than veins?","Blood pressure is higher in arteries, so the thick walls withstand it and maintain the pressure.","June 2022 · Biology 2 · Q6(a)(i)"),
s(T_BLOOD,"Give a reason why veins have valves.","To prevent backflow of blood, because the pressure in veins is low, so blood flows one way towards the heart.","June 2019 · Biology 2 · Q3(b)(i)"),
m(T_BLOOD,"Which artery carries oxygenated blood away from the heart to the body?",["Pulmonary artery","Aorta","Vena cava","Pulmonary vein"],1,"The aorta carries oxygenated blood from the left ventricle to the body.","June 2019 · Biology 2 · Q3(b)(ii)"),
s(T_BLOOD,"Explain why the wall of the left ventricle is thicker than the wall of the right ventricle.","The left ventricle pumps blood around the whole body at higher pressure, so it is more muscular. The right ventricle only pumps to the lungs.","June 2024 · Biology 2 · Q5(a)"),
s(T_BLOOD,"Describe how blood is moved from the heart to the lungs.","The right ventricle contracts (muscular walls), pushing blood under pressure out through the pulmonary artery to the lungs.","June 2023 · Biology 2 · Q2(d)"),
s(T_BLOOD,"Describe how blood is moved from the left ventricle to the body.","The ventricle contracts and puts the blood under pressure; it flows through the valve into the aorta and on to the body.","June 2025 · Biology 2 · Q4(c)"),
s(T_BLOOD,"Why must equipment used for heart dissection be disinfected?","To kill bacteria, pathogens or microorganisms.","June 2020 · Biology 2 · Q1(b)(ii)"),
m(T_BLOOD,"Which part of the blood carries insulin?",["Plasma","Platelets","Red blood cells","White blood cells"],0,"Plasma carries dissolved substances such as insulin.","June 2018 · Biology 2 · Q1(a)(ii)"),
m(T_BLOOD,"Which blood component helps with blood clotting?",["Plasma","Red blood cells","Platelets","White blood cells"],2,"Platelets help the blood clot.","June 2020 · Biology 2 · Q2(b)"),
s(T_BLOOD,"Name the substance in red blood cells that carries oxygen.","Haemoglobin.","June 2021 · Biology 2 · Q1(a)(ii)"),
s(T_BLOOD,"Describe two ways a red blood cell is adapted for its function.","Any two: biconcave disc shape (large surface area); small and flexible; no nucleus, so more room for haemoglobin.","June 2022 · Biology 2 · Q2(a)(ii)"),
s(T_BLOOD,"A student takes a blood sample from a donor. Give two precautions.","Any two: wear gloves or wash hands; sterilise the donor's skin; use a sterile needle; cover the wound.","June 2024 · Biology 2 · Q5(c)(ii)"),
s(T_BLOOD,"Explain why blood flow to the muscles increases during exercise.","The muscles need more oxygen and glucose for respiration to release energy, and more carbon dioxide (or lactic acid) must be removed.","June 2022 · Biology 2 · Q6(b)(ii)"),
s(T_BLOOD,"Describe two ways a capillary is adapted for gas exchange.","Any two: large surface area to volume ratio; very thin wall (one cell thick); gaps or permeable wall; these increase the rate of diffusion by shortening the pathway.","June 2025 · Biology 2 · Q4(d)(ii)"),
s(T_BLOOD,"Explain why a frog's circulation is less efficient than a human's.","A frog's heart has one ventricle (three chambers), with no septum, so oxygenated and deoxygenated blood mix. Humans have two ventricles (four chambers).","June 2018 · Biology 2 · Q5(c)"),
s(T_BLOOD,"Explain how the structure of the heart relates to its function.","Atria push blood into the ventricles; valves prevent backflow; the left ventricle has thicker walls to pump blood to the body at higher pressure; the right ventricle pumps to the lungs; the septum keeps oxygenated and deoxygenated blood separate.","June 2022 · Biology 2 · Q6(c)"),
s(T_BLOOD,"Explain why a heart valve closes after the ventricle has contracted.","The valve closes to prevent backflow of blood.","June 2020 · Biology 2 · Q1(b)(i)"),
s(T_BLOOD,"Explain why heart rate increases during exercise.","The muscles are used more, so they need more oxygen and glucose for more respiration (and carbon dioxide must be removed faster), so the heart pumps blood faster.","June 2024 · Biology 2 · Q4(d)(ii)"),

/* ===== RESPIRATION & BREATHING ===== */
m(T_RESP,"Which two substances are produced by aerobic respiration?",["Carbon dioxide and water","Lactic acid","Glucose and oxygen","Ethanol and carbon dioxide"],0,"Glucose + oxygen → carbon dioxide + water.","June 2021 · Biology 2 · Q4(a)(ii)"),
m(T_RESP,"Why do cells respire?",["To release energy","To make glucose","To absorb water","To make oxygen"],0,"Respiration releases energy for cell processes.","June 2023 · Biology 2 · Q6(a)"),
s(T_RESP,"State two differences between aerobic and anaerobic respiration.","Aerobic uses oxygen (anaerobic does not); aerobic releases more energy; aerobic makes carbon dioxide and water, anaerobic makes lactic acid in humans; aerobic happens in mitochondria.","June 2023 · Biology 2 · Q6(b)(ii)"),
s(T_RESP,"Explain why breathing rate increases during running.","To absorb more oxygen into the blood for more respiration and energy release, and to remove more carbon dioxide.","June 2023 · Biology 2 · Q6(b)(i)"),
s(T_RESP,"Name the product of anaerobic respiration in muscles that causes cramp.","Lactic acid.","June 2021 · Biology 2 · Q4(c)"),
s(T_RESP,"Explain why leg muscles might tire and cramp when running.","Any three: muscles were not warmed up or stretched; not enough oxygen reaches the muscles; anaerobic respiration happens; lactic acid builds up.","June 2019 · Biology 2 · Q3(c)(ii)"),
s(T_RESP,"Explain why the oxygen absorbed increases with running speed and then levels off, and why lactic acid is made at high speed.","Muscles respire aerobically and need more oxygen as speed rises, until the body cannot absorb any more. At high speed, there is not enough oxygen in the muscles, so they respire anaerobically and make lactic acid.","June 2018 · Biology 2 · Q2(b)"),
s(T_RESP,"Why does breathed-out air turn green BTB solution yellow?","Breath contains carbon dioxide, which dissolves to form a weak acid and lowers the pH.","June 2023 · Biology 2 · Q6(c)(i)"),
s(T_RESP,"Plan an investigation using BTB to compare the carbon dioxide in breath after running at different speeds.","Athletes run at different speeds (fixed time or distance, or a treadmill); breathe into the same volume of green BTB and time the colour change; link to carbon dioxide and pH. Control age, sex, lifestyle, run time, BTB volume and concentration, and rest between runs.","June 2023 · Biology 2 · Q6(c)(ii)"),
s(T_RESP,"Germinating peas turn hydrogencarbonate indicator yellow but dried peas do not. Explain why.","Germinating peas respire aerobically and produce carbon dioxide. Dried peas do not respire.","June 2019 · Biology 2 · Q6(b)(i)"),
s(T_RESP,"Describe a suitable control in a hydrogencarbonate indicator experiment on respiration.","Use the same equipment and indicator but replace the organisms with a similar mass of inert material (such as glass beads).","June 2019 · Biology 2 · Q6(a)(ii)"),
s(T_RESP,"In a respirometer, soda lime absorbs carbon dioxide. Why is this needed, and what happens if less oxygen is used?","It absorbs the carbon dioxide produced so only oxygen use changes the volume. If less oxygen is used, there is less respiration and the drop moves more slowly or a shorter distance.","June 2025 · Biology 2 · Q5(d)"),
s(T_RESP,"In emphysema the surface area of the alveoli is ______ and gas exchange by ______ is reduced. Fill the gaps.","Smaller; diffusion.","June 2018 · Biology 2 · Q2(a)"),
m(T_RESP,"Which process moves carbon dioxide from the blood into an alveolus?",["Diffusion","Osmosis","Active transport","Transpiration"],0,"Carbon dioxide moves down its concentration gradient by diffusion.","June 2024 · Biology 2 · Q4(a)"),
s(T_RESP,"Explain how alveoli are adapted for gas exchange.","Many alveoli give a large surface area; moist surface; thin, permeable walls; good blood supply (surrounding capillaries); a high oxygen and low carbon dioxide concentration is maintained.","June 2021 · Biology 2 · Q6(c)"),
s(T_RESP,"What is the function of cilia on ciliated epithelial cells in the airways?","To waft mucus carrying bacteria and dust.","June 2021 · Biology 2 · Q6(a)(ii)"),
s(T_RESP,"Why is the respiration rate of a sleeping person lower than that of a runner?","Respiration supplies energy to muscles. A sleeping person uses little muscle, while a runner uses more muscle and needs more energy.","June 2020 · Biology 2 · Q4(c)(ii)"),
s(T_RESP,"What is the function of mitochondria?","They release energy by aerobic respiration.","June 2020 · Biology 2 · Q6(b)(iii)"),
s(T_RESP,"Describe how to compare the breathing rates of two groups of people.","Control a variable such as age or BMI range; use the same environment; count breaths in a set time; calculate means; repeat.","June 2021 · Biology 2 · Q4(b)(iii)"),

/* ===== HORMONES, DIABETES & REPRODUCTION ===== */
m(T_HORM,"Which gland produces insulin?",["Thyroid","Pancreas","Adrenal","Pituitary"],1,"The pancreas makes insulin.","June 2024 · Biology 2 · Q3(c)(i)"),
s(T_HORM,"How is insulin transported, and what is its main target organ?","Transported in the blood plasma. The main target organ is the liver (muscles are also accepted).","June 2024 · Biology 2 · Q3(c)(ii)–(iii)"),
m(T_HORM,"Which term describes maintaining constant internal conditions?",["Respiration","Diffusion","Digestion","Homeostasis"],3,"Homeostasis is the maintenance of a stable internal environment.","June 2019 · Biology 2 · Q2(c)"),
m(T_HORM,"How is adrenalin transported around the body?",["Transpiration","Osmosis","Dissolved in blood plasma","Carried by red blood cells"],2,"Hormones are carried dissolved in the blood plasma.","June 2019 · Biology 2 · Q2(b)"),
s(T_HORM,"Explain what happens to blood glucose after a meal.","More insulin is released; cells (liver, muscles) take up glucose; glucose is converted to glycogen for storage; and glucose is used in respiration.","June 2018 · Biology 2 · Q1(b)"),
s(T_HORM,"Give one cause of type 1 diabetes.","The pancreas makes little or no insulin (beta cells destroyed by the immune system, or the condition is inherited).","June 2018 · Biology 2 · Q1(c)"),
s(T_HORM,"Give two ways people with type 2 diabetes can control their blood glucose.","Any two: control diet (less sugar or carbohydrate); exercise or lose weight; medication (such as metformin or insulin).","June 2024 · Biology 2 · Q3(e)"),
s(T_HORM,"Give two factors to consider when choosing volunteers for a drug trial.","Any two: gender; age; lifestyle (exercise, diet); size, weight or BMI.","June 2018 · Biology 2 · Q1(e)"),
s(T_HORM,"People with high blood glucose have red blood cells that lose water. Explain why.","The glucose concentration in the plasma is higher than inside the cell, so water leaves the cell by osmosis through a partially permeable membrane.","June 2023 · Biology 2 · Q5(a)(iii)"),
m(T_HORM,"Which hormone lowers blood glucose, and which organ is its target?",["Insulin, liver","Adrenalin, heart","Thyroxine, muscle","Oestrogen, ovary"],0,"Insulin lowers blood glucose; the liver is its main target organ.","June 2023 · Biology 2 · Q5(b)"),
s(T_HORM,"State the effect of the oestrogen peak around day 13 of the menstrual cycle.","The follicle ruptures and the egg is released (ovulation).","June 2023 · Biology 2 · Q3(b)(i)"),
s(T_HORM,"Describe the effect of progesterone on the uterus lining.","It maintains and thickens the lining, with more blood vessels, ready for implantation.","June 2023 · Biology 2 · Q3(b)(ii)"),
s(T_HORM,"Give one advantage and one disadvantage of using condoms.","Advantage: protects against STIs, or easy to use, or no prescription. Disadvantage: can split, or less effective if used incorrectly, or latex allergy.","June 2023 · Biology 2 · Q3(c)"),
s(T_HORM,"Explain one way the contraceptive pill prevents pregnancy.","It contains oestrogen and/or progesterone, which prevents ovulation, or thickens cervical mucus so sperm cannot reach the egg.","June 2023 · Biology 2 · Q3(d)"),

/* ===== ECOLOGY & SAMPLING ===== */
m(T_ECO,"Which shows the levels of organisation from smallest to largest?",["Population, organism, community","Organism, population, community","Community, population, organism","Organism, community, population"],1,"Organism, then population, then community.","June 2021 · Biology 2 · Q2(a)"),
s(T_ECO,"What is a parasite?","An organism that lives on or in a host and feeds off it.","June 2021 · Biology 2 · Q2(c)(ii)"),
